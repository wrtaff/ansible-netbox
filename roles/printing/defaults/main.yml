# ==============================================================================
# Filename:       roles/printing/defaults/main.yml
# Version:        1.0
# Author:         Gemini CLI
# Last Modified:  2026-08-29
# Trac Ticket:    #4436 (Provision network printing via Ansible on limbo-f0 and update WWOS documentation)
#
# Purpose:
#     Default variables for the printing Ansible role on Debian/Ubuntu desktops.
# ==============================================================================
---
printing_packages:
  - cups
  - cups-client
  - cups-bsd
  - printer-driver-all
  - hplip
  - system-config-printer-udev
  - cups-browsed

printing_services:
  - cups
  - cups-browsed

enable_cups_web_access: false

gdrive_spool_root: "/var/spool/gdrive"
gdrive_queue_name: "Print_to_Google_Drive"
gdrive_folder_id: "1Ubrwq-ZhRiCuADsiaNC9uplvcUXr0lhX"
gdrive_uploader_user: "gdrive-uploader"
gdrive_uploader_group: "gdrive-uploader"
gdrive_print_enabled: false

printers:
  - name: "HP_LaserJet_P2055dn"
    ip: "hp-laserjet.home.arpa"
    device_uri: "socket://hp-laserjet.home.arpa:9100"
    is_default: true
    ppd_file: "laserjet.ppd"
    ppd_target_filename: "HP-LaserJet-p2055dn.ppd"

  - name: "HP_OfficeJet_Pro_9010"
    ip: "hp-inkjet.home.arpa"
    device_uri: "ipp://hp-inkjet.home.arpa/ipp/print"
    is_default: false
    ppd_file: ""
    ppd_target_filename: ""

---
- name: Apply host-specific visual identification (XFCE panel button title, panel color accent, and desktop background)
  hosts: desktops
  gather_facts: true
  become: false

  vars:
    host_visual_profiles:
      limbo-f0:
        badge_name: "LIMBO-F0"
        badge_color: "#0055aa"
        panel_rgba: [0.0, 0.33, 0.67, 1.0]
        bg_gradient_start: "#0a192f"
        bg_gradient_end: "#020c1b"
      athena:
        badge_name: "ATHENA"
        badge_color: "#551a8b"
        panel_rgba: [0.33, 0.10, 0.55, 1.0]
        bg_gradient_start: "#1a092b"
        bg_gradient_end: "#0d0217"
      zeus:
        badge_name: "OPTI-CC76"
        badge_color: "#1e5b22"
        panel_rgba: [0.12, 0.36, 0.13, 1.0]
        bg_gradient_start: "#0a2411"
        bg_gradient_end: "#031207"
      opti-cc76:
        badge_name: "OPTI-CC76"
        badge_color: "#1e5b22"
        panel_rgba: [0.12, 0.36, 0.13, 1.0]
        bg_gradient_start: "#0a2411"
        bg_gradient_end: "#031207"
      titan2:
        badge_name: "TITAN2"
        badge_color: "#8b6508"
        panel_rgba: [0.55, 0.40, 0.03, 1.0]
        bg_gradient_start: "#241a05"
        bg_gradient_end: "#120d02"

    active_profile: "{{ host_visual_profiles[inventory_hostname] | default(host_visual_profiles[ansible_facts['hostname']] | default({'badge_name': inventory_hostname | upper, 'badge_color': '#333333', 'panel_rgba': [0.2, 0.2, 0.2, 1.0], 'bg_gradient_start': '#1a1a24', 'bg_gradient_end': '#0d0d12'})) }}"
    xfce_host_badge_name: "{{ active_profile.badge_name }}"
    xfce_host_badge_color: "{{ active_profile.badge_color }}"
    xfce_panel_rgba: "{{ active_profile.panel_rgba }}"
    xfce_bg_gradient_start: "{{ active_profile.bg_gradient_start }}"
    xfce_bg_gradient_end: "{{ active_profile.bg_gradient_end }}"

  tasks:
    - name: Ensure xfce4-genmon-plugin and clipboard tools are present
      become: true
      ansible.builtin.package:
        name:
          - xfce4-genmon-plugin
          - xclip
          - xsel
        state: present

    - name: Ensure user XFCE config directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/xfce4"
        state: directory
        mode: "0755"

    - name: Deploy host-badged xfce_date_click.sh script
      ansible.builtin.template:
        src: ../templates/xfce/xfce_date_click.sh.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/xfce4/xfce_date_click.sh"
        mode: "0755"

    - name: Ensure /usr/local/share/backgrounds directory exists
      become: true
      ansible.builtin.file:
        path: /usr/local/share/backgrounds
        state: directory
        mode: "0755"

    - name: Deploy host-specific SVG desktop background
      become: true
      ansible.builtin.template:
        src: ../templates/xfce/host_background.svg.j2
        dest: "/usr/local/share/backgrounds/{{ inventory_hostname }}-bg.svg"
        mode: "0644"

    - name: Configure desktop-background system alternative
      become: true
      ansible.builtin.shell: |
        update-alternatives --install /usr/share/images/desktop-base/desktop-background desktop-background "/usr/local/share/backgrounds/{{ inventory_hostname }}-bg.svg" 100
        update-alternatives --set desktop-background "/usr/local/share/backgrounds/{{ inventory_hostname }}-bg.svg"
      changed_when: true

    - name: Apply visual branding across active user X and X2Go sessions
      ansible.builtin.shell: |
        # 1. Update per-session environment for all running xfce4-panel instances (native and X2Go)
        pids=$(pgrep -u {{ ansible_user | default('will') }} -f 'xfce4-panel' 2>/dev/null || true)
        if [ -n "$pids" ]; then
          for pid in $pids; do
            if [ -r "/proc/$pid/environ" ]; then
              eval $(strings /proc/$pid/environ | grep -E '^(DISPLAY|DBUS_SESSION_BUS_ADDRESS)=' | sed 's/^/export /')
              xfconf-query -c xfce4-panel -p /plugins/plugin-1/button-title -n -t string -s "⚡ {{ xfce_host_badge_name }}" || xfconf-query -c xfce4-panel -p /plugins/plugin-1/button-title -s "⚡ {{ xfce_host_badge_name }}" || true
              xfconf-query -c xfce4-panel -p /panels/panel-1/background-style -n -t int -s 1 || xfconf-query -c xfce4-panel -p /panels/panel-1/background-style -s 1 || true
              xfconf-query -c xfce4-panel -p /panels/panel-1/background-rgba -n -t double -s {{ xfce_panel_rgba[0] }} -t double -s {{ xfce_panel_rgba[1] }} -t double -s {{ xfce_panel_rgba[2] }} -t double -s {{ xfce_panel_rgba[3] }} || xfconf-query -c xfce4-panel -p /panels/panel-1/background-rgba -t double -s {{ xfce_panel_rgba[0] }} -t double -s {{ xfce_panel_rgba[1] }} -t double -s {{ xfce_panel_rgba[2] }} -t double -s {{ xfce_panel_rgba[3] }} || true
              xfce4-panel -r >/dev/null 2>&1 &
            fi
          done
        else
          # Fallback for display :0 and :50 when no active panel process is running
          for disp in ":0" ":50.0" ":50"; do
            DISPLAY=$disp xfconf-query -c xfce4-panel -p /plugins/plugin-1/button-title -n -t string -s "⚡ {{ xfce_host_badge_name }}" || true
            DISPLAY=$disp xfconf-query -c xfce4-panel -p /panels/panel-1/background-style -n -t int -s 1 || true
            DISPLAY=$disp xfconf-query -c xfce4-panel -p /panels/panel-1/background-rgba -n -t double -s {{ xfce_panel_rgba[0] }} -t double -s {{ xfce_panel_rgba[1] }} -t double -s {{ xfce_panel_rgba[2] }} -t double -s {{ xfce_panel_rgba[3] }} || true
          done
        fi
        sleep 1
      failed_when: false
      changed_when: false

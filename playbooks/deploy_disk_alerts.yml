---
# ==============================================================================
# Filename:       deploy_disk_alerts.yml
# Version:        2.0
# Author:         jimmy (claude@agent-runner-pve5-01)
# Last Modified:  2026-09-03
# Context:        http://trac.gafla.us.com/ticket/4494 (WP-2)
#                 Supersedes the v1.3 inline script and the #4078 recipient
#                 policy. See the disk_alerts role for the rationale on each
#                 threshold and on the recipient list.
#
# Purpose:
#     Deploys the host disk capacity monitor and ensures the system mail
#     client is configured to deliver its alerts.
#
# CHANGES FROM v1.3 (all from the Trac #4494 review):
#     * The inline `copy: content:` heredoc is replaced by the disk_alerts
#       role, so thresholds and recipients are variables rather than
#       copy-pasted literals. Three divergent script versions were live.
#     * Recipients restored to root@home.arpa AND wrtaff@gmail.com per the
#       WP-0 decision (Will, 2026-09-03), superseding #4078 2026-08-13.
#     * Lock-file latch replaced by a state machine with a re-notify interval
#       and a clear threshold below the alert threshold.
#     * The state write is gated on delivery success.
#     * cron replaced by a randomized systemd timer that logs to the journal.
#
# NOT YET DONE -- tracked as #4494 WP-4, gated on Will's approval:
#     The `hosts:` list below is UNCHANGED from v1.3 and still omits
#     wazuh-siem (CT 112), vik-01, ot-recorder and the gmailctl-ansible relay,
#     and pve4 has never received a successful run. Do not widen this list
#     without running --list-hosts past Will first.
# ==============================================================================
- name: Deploy Disk Alerts and Configure System Mail
  hosts: agent_runners, proxmox, ktn_lxc, containers
  become: yes
  roles:
    - role: system_mail_client
      when: "inventory_hostname != 'gmailctl-ansible' and (ansible_host | default('') != '192.168.0.25')"
    - role: disk_alerts

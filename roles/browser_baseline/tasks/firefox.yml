---
# tasks/firefox.yml - Declarative Firefox installation and managed policies

- name: Install Firefox package
  ansible.builtin.apt:
    name: "{{ firefox_package_name }}"
    state: present
    update_cache: yes

- name: Ensure Firefox enterprise policies directory exists
  ansible.builtin.file:
    path: "{{ firefox_policy_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Firefox enterprise managed policies
  ansible.builtin.template:
    src: firefox_policies.json.j2
    dest: "{{ firefox_policy_file }}"
    owner: root
    group: root
    mode: '0644'

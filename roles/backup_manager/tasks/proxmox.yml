# ==============================================================================
# Filename:       roles/backup_manager/tasks/proxmox.yml
# Version:        1.0
# Author:         Gemini CLI
# Last Modified:  2026-02-02
# Context:        http://trac.home.arpa/ticket/3008
#
# Purpose:
#    Templates and manages /etc/pve/jobs.cfg for Proxmox backup scheduling.
# ==============================================================================
---
- name: "Ensure /etc/pve/jobs.cfg is managed"
  template:
    src: jobs.cfg.j2
    dest: /tmp/ansible-pve-jobs.cfg
    mode: '0640'
  register: proxmox_jobs_candidate
  # Check mode must render the remote candidate before it can be validated.
  check_mode: false
  when: proxmox_backup_jobs is defined

- name: "Read rendered Proxmox backup jobs candidate"
  slurp:
    src: /tmp/ansible-pve-jobs.cfg
  register: proxmox_jobs_candidate_content
  when: proxmox_backup_jobs is defined

- name: "Fail closed when no Proxmox backup jobs render"
  ansible.builtin.assert:
    that:
      - "'vzdump:' in (proxmox_jobs_candidate_content.content | b64decode)"
    fail_msg: "Refusing to deploy an empty Proxmox backup job configuration."
  when: proxmox_backup_jobs is defined

- name: "Fail closed when required Proxmox backup jobs are missing"
  ansible.builtin.assert:
    that:
      - "'vmid ' ~ item.vmid ~ '\n' in (proxmox_jobs_candidate_content.content | b64decode)"
      - "item.node is not defined or ('node ' ~ item.node ~ '\n') in (proxmox_jobs_candidate_content.content | b64decode)"
    fail_msg: "Refusing to deploy a Proxmox backup job configuration missing the required VMID and node association."
  loop: "{{ proxmox_backup_jobs }}"
  loop_control:
    label: "{{ item.id | default(item.vmid) }}"
  when:
    - proxmox_backup_jobs is defined
    - item.node is not defined or item.node == (proxmox_node_name | default(inventory_hostname))

- name: "Install validated Proxmox backup jobs"
  copy:
    src: /tmp/ansible-pve-jobs.cfg
    remote_src: true
    dest: /etc/pve/jobs.cfg
    owner: root
    group: www-data
    mode: '0640'
  notify: restart pvescheduler
  when: proxmox_backup_jobs is defined

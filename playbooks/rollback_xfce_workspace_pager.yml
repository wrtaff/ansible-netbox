---
# Trac #4190: restore only the XFCE panel channel.
# Usage: ansible-playbook -i inventory.ini playbooks/rollback_xfce_workspace_pager.yml
#        --limit limbo-f0 -e backup_file=/home/will/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml.bak.TIMESTAMP

- name: Roll back XFCE workspace pager presentation
  hosts: limbo-f0
  gather_facts: false
  become: true
  vars:
    xfce_user: will
    xfce_home: /home/will
    panel_file: "{{ xfce_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml"

  tasks:
    - name: Require an explicit backup file
      ansible.builtin.assert:
        that:
          - backup_file is defined
          - backup_file | length > 0
        fail_msg: "Pass -e backup_file=/path/to/xfce4-panel.xml.bak.TIMESTAMP"

    - name: Restore panel channel
      ansible.builtin.copy:
        src: "{{ backup_file }}"
        dest: "{{ panel_file }}"
        remote_src: true
        owner: "{{ xfce_user }}"
        group: "{{ xfce_user }}"
        mode: '0644'
      become_user: "{{ xfce_user }}"

    - name: Reload the panel from restored configuration
      ansible.builtin.command: xfce4-panel -r
      become_user: "{{ xfce_user }}"
      async: 1
      poll: 0
      changed_when: false

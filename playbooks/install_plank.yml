---
- name: Install and configure Plank dock on desktops
  hosts: desktops
  gather_facts: true
  become: false

  tasks:
    - name: Ensure Plank dock is installed
      become: true
      ansible.builtin.package:
        name:
          - plank
        state: present

    - name: Ensure dconf/GSettings directory exists for user
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/plank/dock1/settings"
        state: directory
        mode: "0755"
        recurse: true

    - name: Configure Plank settings via dconf if available
      ansible.builtin.shell: |
        dconf write /net/launchpad/plank/docks/dock1/position "'bottom'" || true
        dconf write /net/launchpad/plank/docks/dock1/alignment "'center'" || true
        dconf write /net/launchpad/plank/docks/dock1/hide-mode "'auto'" || true
      environment:
        DISPLAY: ":0"
        XDG_SESSION_TYPE: "x11"
      failed_when: false
      changed_when: false

    - name: Ensure Plank autostart is configured in i3 config
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts['user_dir'] }}/.config/i3/config"
        line: "exec_always --no-startup-id env XDG_SESSION_TYPE=x11 plank"
        state: present

---
- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download ntfy repository GPG key
  ansible.builtin.get_url:
    url: https://archive.ntfy.sh/apt/keyring.gpg
    dest: /etc/apt/keyrings/ntfy.gpg
    mode: "0644"

- name: Add ntfy apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/ntfy.gpg] https://archive.ntfy.sh/apt stable main"
    state: present
    filename: ntfy
    update_cache: true

- name: Install ntfy
  ansible.builtin.apt:
    name: ntfy
    state: present

- name: Template ntfy server configuration
  ansible.builtin.template:
    src: server.yml.j2
    dest: /etc/ntfy/server.yml
    owner: root
    group: ntfy
    mode: "0640"
  notify: Restart ntfy

- name: Enable and start ntfy service
  ansible.builtin.systemd:
    name: ntfy
    enabled: true
    state: started

- name: Check Tailscale login state
  ansible.builtin.command: tailscale status
  register: ntfy_tailscale_status
  changed_when: false
  failed_when: false
  when: ntfy_enable_tailscale | bool

- name: Fail if Tailscale is not joined
  ansible.builtin.fail:
    msg: "Tailscale is not logged in on {{ inventory_hostname }}. Run playbooks/onboard_ntfy_tailscale.yml first."
  when:
    - ntfy_enable_tailscale | bool
    - ntfy_tailscale_status.rc != 0

- name: Configure Tailnet HTTPS proxy to ntfy
  ansible.builtin.command: >
    tailscale serve --bg --https=443 http://127.0.0.1:80
  changed_when: false
  when: ntfy_enable_tailscale | bool

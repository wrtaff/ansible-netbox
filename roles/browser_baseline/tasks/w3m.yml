---
# ==============================================================================
# Filename:       roles/browser_baseline/tasks/w3m.yml
# Version:        1.0
# Author:         Pops AI / Gemini
# Last Modified:  2026-09-12
# Trac Tickets:   #4604, #3540, #4557
#
# Purpose:
#     Declarative w3m text-based browser baseline configuration.
# ==============================================================================

- name: Install w3m text-based web browser package
  ansible.builtin.apt:
    name: "{{ w3m_package_name }}"
    state: present
    update_cache: yes

- name: Ensure w3m user configuration directory exists
  ansible.builtin.file:
    path: "/home/{{ browser_baseline_user }}/.w3m"
    state: directory
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0700'

- name: Deploy w3m configuration (config)
  ansible.builtin.template:
    src: w3m_config.j2
    dest: "/home/{{ browser_baseline_user }}/.w3m/config"
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0600'

- name: Deploy w3m bookmarks (bookmark.html)
  ansible.builtin.template:
    src: w3m_bookmark.html.j2
    dest: "/home/{{ browser_baseline_user }}/.w3m/bookmark.html"
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0600'

- name: Deploy w3m URI method map for search shortcuts (urimethodmap)
  ansible.builtin.template:
    src: w3m_urimethodmap.j2
    dest: "/home/{{ browser_baseline_user }}/.w3m/urimethodmap"
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0600'

- name: Deploy w3m site configuration (siteconf)
  ansible.builtin.template:
    src: w3m_siteconf.j2
    dest: "/home/{{ browser_baseline_user }}/.w3m/siteconf"
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0600'

- name: Deploy w3m keymap (keymap)
  ansible.builtin.template:
    src: w3m_keymap.j2
    dest: "/home/{{ browser_baseline_user }}/.w3m/keymap"
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0600'

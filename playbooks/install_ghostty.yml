# ==============================================================================
# Filename:       playbooks/install_ghostty.yml
# Version:        1.2
# Author:         Will / Pops agents
# Last Modified:  2026-08-31
# Trac Ticket:    #4419 - Install Ghostty terminal emulator on limbo-f0
#
# Purpose:
#     Install Ghostty terminal emulator on managed Debian desktops while
#     preserving xfce4-terminal as the default system and XFCE terminal emulator.
#
# Use Case:
#     Provide Ghostty as a modern GPU-accelerated terminal emulator for native
#     sessions, beginning with limbo-f0 as the test host, while keeping
#     xfce4-terminal as the default terminal for full X2Go/XInput compatibility.
#
# Installation Method:
#     Downloads the release asset for the target architecture from the
#     community-maintained mkasberg/ghostty-ubuntu GitHub repository, verifies
#     its published SHA-256 digest, then installs it with apt. Explicitly sets
#     update-alternatives for x-terminal-emulator to xfce4-terminal.wrapper.
#
# Prerequisites:
#     - Debian Trixie or Forky desktop in the desktops inventory group
#     - amd64 or arm64 architecture supported by the upstream package release
#     - Internet access to GitHub's API and release assets
#
# Configuration:
#     - Ghostty user configuration is managed separately in
#       ~/.config/ghostty/config.
#     - Ghostty works in native XFCE sessions. The current X2Go x2goagent
#       server exposes XInput 1.3 rather than the XInput2 required by GTK 4;
#       xfce4-terminal is preserved as the default terminal emulator.
#
# Secrets:
#     None - no vault variables required
#
# Usage:
#     # Dry run first
#     ansible-playbook -i inventory.ini playbooks/install_ghostty.yml \
#         --limit limbo-f0 --check --diff
#
#     # Live run
#     ansible-playbook -i inventory.ini playbooks/install_ghostty.yml \
#         --limit limbo-f0
#
# Removal Instructions:
#     apt purge ghostty
#
# Revision History:
#     1.2 - Preserved xfce4-terminal as the default x-terminal-emulator alternative.
#     1.1 - Documented current X2Go/XInput2 incompatibility.
#     1.0 - Initial playbook for limbo-f0 test deployment.
#
# NOTES:
#     The Ghostty project documents this as a community-built package, not an
#     official Linux binary. Review that trust decision before wider rollout.
#
# WWOS:   http://wwos.home.arpa/index.php/Playbooks/install_ghostty.yml
# GitHub: https://github.com/wrtaff/ansible-netbox/blob/main/playbooks/install_ghostty.yml
# ==============================================================================
---
- name: Install Ghostty on managed Debian desktops
  hosts: desktops
  become: true
  gather_facts: true
  vars:
    ghostty_release_api: https://api.github.com/repos/mkasberg/ghostty-ubuntu/releases/latest
    ghostty_deb_directory: /var/tmp/ghostty

  tasks:
    - name: Verify supported Debian release
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_release'] in ['trixie', 'forky']
        fail_msg: >-
          Ghostty's community Debian package supports only Debian Trixie and
          Forky. This host is {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_release'] }}.

    - name: Get Debian package architecture
      ansible.builtin.command:
        cmd: dpkg --print-architecture
      changed_when: false
      check_mode: false
      register: ghostty_deb_architecture

    - name: Get latest Ghostty community package release
      ansible.builtin.uri:
        url: "{{ ghostty_release_api }}"
        return_content: true
        status_code: 200
      register: ghostty_release
      check_mode: false

    - name: Select package asset for host release and architecture
      ansible.builtin.set_fact:
        ghostty_deb_asset: >-
          {{ ghostty_release.json.assets
             | selectattr(
                 'name', 'match',
                 '^ghostty_[^_]+_' ~ ghostty_deb_architecture.stdout ~ '_'
                 ~ ansible_facts['distribution_release'] ~ '\.deb$'
               )
             | list
             | first
             | default({}) }}

    - name: Verify a matching Ghostty package asset exists
      ansible.builtin.assert:
        that:
          - ghostty_deb_asset.browser_download_url is defined
          - ghostty_deb_asset.digest is defined
        fail_msg: >-
          The latest Ghostty community release has no digest-verified package
          for {{ ghostty_deb_architecture.stdout }} Debian
          {{ ansible_facts['distribution_release'] }}.

    - name: Create Ghostty package download directory
      ansible.builtin.file:
        path: "{{ ghostty_deb_directory }}"
        state: directory
        mode: '0755'

    - name: Download verified Ghostty package
      ansible.builtin.get_url:
        url: "{{ ghostty_deb_asset.browser_download_url }}"
        dest: "{{ ghostty_deb_directory }}/{{ ghostty_deb_asset.name }}"
        checksum: "{{ ghostty_deb_asset.digest }}"
        mode: '0644'
      # Check mode validates the release metadata without downloading the asset.
      when: not ansible_check_mode

    - name: Install Ghostty package
      ansible.builtin.apt:
        deb: "{{ ghostty_deb_directory }}/{{ ghostty_deb_asset.name }}"
        state: present
      # The .deb is intentionally not downloaded during a dry run.
      when: not ansible_check_mode

    - name: Ensure xfce4-terminal remains default x-terminal-emulator alternative
      community.general.alternatives:
        name: x-terminal-emulator
        path: /usr/bin/xfce4-terminal.wrapper
      when: not ansible_check_mode


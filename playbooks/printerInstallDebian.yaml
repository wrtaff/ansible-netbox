# ===============================================================================
# Filename:       playbooks/printerInstallDebian.yaml
# Version:        2.0
# Author:         Gemini CLI
# Last Modified:  2026-08-29
# Trac Ticket:    #4436 (Provision network printing via Ansible on limbo-f0 and update WWOS documentation)
#
# Purpose:
#     Configures standard network printers (HP LaserJet P2055dn and HP OfficeJet Pro 9010)
#     on Debian/Ubuntu desktop workstations by applying the printing role.
#
# Use Case:
#     Automates the setup of standardized network printers across home lab desktop
#     workstations (group: desktops), configuring CUPS, PPD fallbacks, and driverless IPP.
#
# Installation Method:
#     Applies role 'printing' which installs CUPS, driver packages, and configures queues via lpadmin.
#
# Prerequisites:
#     - Target hosts must be part of the 'desktops' group in inventory.ini.
#     - PPD files (laserjet.ppd) are bundled within roles/printing/files/.
#     - Sudo access on target host (via ansible_become_pass for desktops).
#
# Configuration:
#     - /etc/cups/cupsd.conf (CUPS server configuration)
#     - /etc/cups/printers.conf (Queue definitions managed by lpadmin)
#
# Secrets:
#     ansible_become_pass  (vault.yml) — sudo access on desktop target hosts
#
# Usage:
#     # Dry run first
#     ansible-playbook -i inventory.ini playbooks/printerInstallDebian.yaml \
#         --limit limbo-f0 --check --diff
#
#     # Live run targeting a single desktop
#     ansible-playbook -i inventory.ini playbooks/printerInstallDebian.yaml \
#         --limit limbo-f0
#
#     # Live run targeting all desktops
#     ansible-playbook -i inventory.ini playbooks/printerInstallDebian.yaml
#
# Removal Instructions:
#     sudo lpadmin -x HP_LaserJet_P2055dn
#     sudo lpadmin -x HP_OfficeJet_Pro_9010
#     sudo apt purge cups hplip printer-driver-all
#
# Revision History:
#     1.0 - Initial monolithic playbook targeting debian group. Trac #2515, #3246.
#     2.0 - Refactored to use modular printing role, updated host selector to desktops,
#           and added limbo-f0 support. Trac #4436.
#
# WWOS:   http://wwos.home.arpa/index.php/Playbooks/printerInstallDebian.yaml
# GitHub: https://github.com/wrtaff/ansible-netbox/blob/master/playbooks/printerInstallDebian.yaml
# ===============================================================================
---
- name: Configure standard printers on desktop workstations
  hosts: "{{ target_hosts | default('desktops') }}"
  become: yes

  roles:
    - role: printing

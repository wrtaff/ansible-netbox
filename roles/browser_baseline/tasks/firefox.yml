---
# tasks/firefox.yml - Declarative Firefox installation, managed policies, and multi-profile baseline

- name: Install Firefox package
  ansible.builtin.apt:
    name: "{{ firefox_package_name }}"
    state: present
    update_cache: yes

- name: Ensure Firefox enterprise policies directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ firefox_policy_dir }}"
    - "/etc/firefox-esr/policies"
    - "/usr/lib/firefox-esr/distribution/policies"
    - "/usr/lib/firefox/distribution/policies"

- name: Deploy Firefox enterprise managed policies
  ansible.builtin.template:
    src: firefox_policies.json.j2
    dest: "{{ firefox_policy_file }}"
    owner: root
    group: root
    mode: '0644'
  register: firefox_policy_deploy

- name: Symlink Firefox enterprise managed policies to distribution and ESR policy paths
  ansible.builtin.file:
    src: "{{ firefox_policy_file }}"
    dest: "{{ item }}"
    state: link
    force: yes
    owner: root
    group: root
  loop:
    - "/etc/firefox-esr/policies/policies.json"
    - "/usr/lib/firefox-esr/distribution/policies/policies.json"
    - "/usr/lib/firefox/distribution/policies/policies.json"
  register: firefox_policy_symlinks

- name: Find cached search.json.mozlz4 files across Firefox profiles
  ansible.builtin.find:
    paths: "/home/{{ browser_baseline_user }}/.mozilla/firefox"
    patterns: "search.json.mozlz4"
    recurse: yes
  register: firefox_search_cache_files
  when: (firefox_policy_deploy.changed | default(false)) or (firefox_policy_symlinks.changed | default(false))

- name: Clear cached search.json.mozlz4 so Firefox rebuilds search engines from enterprise policies
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ firefox_search_cache_files.files | default([]) }}"
  when: (firefox_policy_deploy.changed | default(false)) or (firefox_policy_symlinks.changed | default(false))

- name: Ensure Firefox base user configuration directory exists
  ansible.builtin.file:
    path: "/home/{{ browser_baseline_user }}/.mozilla/firefox"
    state: directory
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0700'

- name: Ensure named Firefox profile directories exist
  ansible.builtin.file:
    path: "/home/{{ browser_baseline_user }}/.mozilla/firefox/{{ item.path }}"
    state: directory
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0700'
  loop: "{{ firefox_named_profiles }}"

- name: Deploy Firefox profiles.ini configuration
  ansible.builtin.template:
    src: profiles.ini.j2
    dest: "/home/{{ browser_baseline_user }}/.mozilla/firefox/profiles.ini"
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0644'

- name: Deploy Firefox named profile wrapper scripts
  ansible.builtin.template:
    src: firefox_wrapper.sh.j2
    dest: "/usr/local/bin/{{ item.cmd_name }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ firefox_named_profiles }}"
  vars:
    profile: "{{ item }}"

- name: Deploy unified Firefox desktop launcher with profile selector
  ansible.builtin.template:
    src: firefox_esr.desktop.j2
    dest: /usr/share/applications/firefox-esr.desktop
    owner: root
    group: root
    mode: '0644'

- name: Remove redundant individual profile desktop launchers from menu
  ansible.builtin.file:
    path: "/usr/share/applications/{{ item }}.desktop"
    state: absent
  loop:
    - ff-remote-0
    - ff-remote-1
    - ff-remote-2

- name: Deploy Firefox search alias synchronization script
  ansible.builtin.copy:
    src: sync_firefox_search_aliases.py
    dest: /usr/local/bin/sync_firefox_search_aliases.py
    owner: root
    group: root
    mode: '0755'

- name: Synchronize search keywords in Firefox profile search databases
  ansible.builtin.command:
    cmd: "python3 /usr/local/bin/sync_firefox_search_aliases.py /home/{{ browser_baseline_user }}/.mozilla/firefox"
  become: true
  become_user: "{{ browser_baseline_user }}"
  changed_when: false

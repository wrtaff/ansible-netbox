# Filename:       install_i3.yml
# Version:        1.0
# Author:         Gemini CLI
# Last Modified:  2026-09-07
# Trac Ticket:    #4508
# Purpose:        Install i3 window manager and companion desktop tools on managed desktops.
# Use Case:       Provide i3 tiling window manager session option on desktop hosts (including limbo-f0).
# Installation Method: Debian apt package manager
# Prerequisites:  Debian-based host in the desktops inventory group
# Configuration:  Xsession (/usr/share/xsessions/i3.desktop)
# Secrets:        ansible_become_pass (vault.yml) - sudo on desktop hosts
# Usage:          ansible-playbook -i inventory.ini playbooks/install_i3.yml --limit limbo-f0 --check --diff
# Removal Instructions: apt purge i3 i3-wm i3lock i3status rofi dunst feh picom
# WWOS:           http://wwos.home.arpa/index.php/Playbooks/install_i3.yml
# GitHub:         https://github.com/wrtaff/ansible-netbox/blob/main/playbooks/install_i3.yml
---
- name: Install i3 window manager and companion tools on desktops
  hosts: desktops
  become: true
  vars_files:
    - ../vault.yml
  tasks:
    - name: Ensure i3 and companion desktop packages are installed
      ansible.builtin.apt:
        name:
          - i3
          - i3-wm
          - i3lock
          - i3status
          - rofi
          - dunst
          - feh
          - picom
          - x11-xserver-utils
        state: present
        update_cache: true

---
ktn_version: "v2.0.9"
ktn_repository: "https://github.com/leafac/kill-the-newsletter.git"
ktn_user: "kill-the-newsletter"
ktn_group: "kill-the-newsletter"
ktn_root: "/opt/kill-the-newsletter"
ktn_data_directory: "/var/lib/kill-the-newsletter/data"
ktn_hostname: "ktn-lxc-01.home.arpa"
ktn_enable_tailscale: false
ktn_tls_hostname: "ktn-lxc-01.van-bee.ts.net"
ktn_smtp_port: 2525
ktn_http_port: 8088
ktn_tls_directory: "/etc/ssl/tailscale/ktn-lxc-01.van-bee.ts.net"
ktn_puller_state_directory: "/var/lib/ktn-imap-puller"
ktn_delivery_state: "/var/lib/ktn-imap-puller/delivered-messages.json"
ktn_feed_provisioner_path: "/usr/local/sbin/create-ktn-feed"
ktn_feed_provisioner_url: "http://127.0.0.1:8088/"
ktn_imap_user: "wrtaff@gmail.com"
ktn_imap_host: "imap.gmail.com"
ktn_imap_port: 993
ktn_imap_interval: "5min"
# Trac #4567: bound every run so a throttled/stalled Gmail IMAP session can
# never wedge the service (and with it the timer) again.
ktn_imap_timeout: 60
ktn_smtp_timeout: 30
# Wall-clock budget for one puller run, in seconds. Must be < the service
# TimeoutStartSec below. A run that hits the budget saves progress and exits 0.
ktn_puller_run_budget: 1200
# Hard cap systemd places on a single run before it SIGKILLs it. Keep it a
# little above ktn_puller_run_budget so a healthy run ends itself first.
ktn_puller_timeout_start: "1500s"
# Messages larger than the KTN loopback SMTP DATA limit are skipped + logged
# instead of raising SMTPDataError 552 on every run.
ktn_max_message_bytes: 524288

---
# tasks/firefox.yml - Declarative Firefox installation, managed policies, and multi-profile baseline

- name: Install Firefox package
  ansible.builtin.apt:
    name: "{{ firefox_package_name }}"
    state: present
    update_cache: yes

- name: Ensure Firefox enterprise policies directory exists
  ansible.builtin.file:
    path: "{{ firefox_policy_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Firefox enterprise managed policies
  ansible.builtin.template:
    src: firefox_policies.json.j2
    dest: "{{ firefox_policy_file }}"
    owner: root
    group: root
    mode: '0644'

- name: Ensure Firefox base user configuration directory exists
  ansible.builtin.file:
    path: "/home/{{ browser_baseline_user }}/.mozilla/firefox"
    state: directory
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0700'

- name: Ensure named Firefox profile directories exist
  ansible.builtin.file:
    path: "/home/{{ browser_baseline_user }}/.mozilla/firefox/{{ item.path }}"
    state: directory
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0700'
  loop: "{{ firefox_named_profiles }}"

- name: Deploy Firefox profiles.ini configuration
  ansible.builtin.template:
    src: profiles.ini.j2
    dest: "/home/{{ browser_baseline_user }}/.mozilla/firefox/profiles.ini"
    owner: "{{ browser_baseline_user }}"
    group: "{{ browser_baseline_user }}"
    mode: '0644'

- name: Deploy Firefox named profile wrapper scripts
  ansible.builtin.template:
    src: firefox_wrapper.sh.j2
    dest: "/usr/local/bin/{{ item.cmd_name }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ firefox_named_profiles }}"
  vars:
    profile: "{{ item }}"

- name: Deploy unified Firefox desktop launcher with profile selector
  ansible.builtin.template:
    src: firefox_esr.desktop.j2
    dest: /usr/share/applications/firefox-esr.desktop
    owner: root
    group: root
    mode: '0644'

- name: Remove redundant individual profile desktop launchers from menu
  ansible.builtin.file:
    path: "/usr/share/applications/{{ item }}.desktop"
    state: absent
  loop:
    - ff-remote-0
    - ff-remote-1
    - ff-remote-2

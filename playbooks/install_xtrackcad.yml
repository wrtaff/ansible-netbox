---
# ==============================================================================
# Filename:       playbooks/install_xtrackcad.yml
# Version:        1.0
# Author:         Gemini
# Last Modified:  2026-09-07
# Trac Ticket:    4520
#
# Purpose:
#     Installs XTrackCAD CAD software for model railroad layout design.
#
# Use Case:
#     Provides CAD tools for track planning, layout drafting, and turnout library
#     management on managed workstations (e.g. Zeus, Athena, desktop group).
#
# Installation Method:
#     apt package manager (xtrkcad, xtrkcad-common)
#
# Prerequisites:
#     - Debian/Ubuntu based OS with GUI / X11
#
# Configuration:
#     - Layout files stored under /mnt/smb/share/Projects/model_trains/
#
# Secrets:
#     ansible_become_pass  (vault.yml) — sudo on target hosts
#
# Usage:
#     # Dry run first
#     ansible-playbook -i inventory.ini playbooks/install_xtrackcad.yml \
#         --limit <host> --check --diff
#
#     # Live run
#     ansible-playbook -i inventory.ini playbooks/install_xtrackcad.yml \
#         --limit <host>
#
# Removal Instructions:
#     apt purge xtrkcad xtrkcad-common
#
# Revision History:
#     1.0 (2026-09-07) - Initial playbook created for Trac #4520.
#
# NOTES:
#     Always bump versions when making changes and annotate them here.
#
# WWOS:   http://wwos.home.arpa/index.php/Playbooks/install_xtrackcad.yml
# GitHub: https://github.com/wrtaff/ansible-netbox/blob/main/playbooks/install_xtrackcad.yml
# ==============================================================================

- name: Install XTrackCAD on desktops
  hosts: "{{ target_hosts | default('desktops') }}"
  become: yes
  vars_files:
    - ../vault.yml
  tasks:
    - name: Ensure XTrackCAD packages are installed
      ansible.builtin.apt:
        name:
          - xtrkcad
          - xtrkcad-common
        state: present
        update_cache: yes

---
# ==============================================================================
# Filename:       playbooks/configure_mcp_servers_remote.yml
# Version:        1.4
# Author:         Gemini CLI
# Last Modified:  2026-08-19
# Context:        http://trac.home.arpa/ticket/3214, http://trac.gafla.us.com/ticket/4123, http://trac.gafla.us.com/ticket/4258
#
# Purpose:
#   Provisions MCP servers for Gemini CLI on remote desktops.
#   Sets up the virtual environment, installs dependencies, and renders one
#   canonical MCP catalog for Claude, Antigravity, and OpenCode.
#
# Secrets:
#   vault.yml variables - API credentials deployed to the managed MCP shell
#                         environment; secret values are never stored here.
#
# Usage:
#   ansible-playbook -i inventory.ini playbooks/configure_mcp_servers_remote.yml
#
# Revision History:
#   1.4 (2026-08-19): Switch Playwright MCP to progressive lazy-loading Python
#                     proxy to eliminate idle Node memory across sessions. Trac #4258.
#   1.3 (2026-08-11): Install the pinned pynetbox dependency required by the
#                     NetBox MCP server. Trac #4203.
#   1.2 (2026-08-07): Render one canonical MCP catalog for all agent harnesses.
# ==============================================================================

- name: Configure MCP Servers on Remote Desktops
  hosts: "{{ mcp_target_hosts | default('desktops,agent_runners') }}"
  vars_files:
    - ../vault.yml
  vars:
    gemini_user: "will"
    repo_path: "/home/{{ gemini_user }}/ansible-netbox"
    gemini_project_dir: "/home/{{ gemini_user }}/gemini_projects"
    venv_path: "/home/{{ gemini_user }}/ansible-netbox/.venv"
    # The one managed catalog for custom Python MCP servers. Secret values stay
    # in the Ansible-managed shell environment, not in harness config files.
    mcp_servers:
      trac:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/trac/server.py"
        env:
          TRAC_URL: "http://trac.home.arpa/login/xmlrpc"
      google-workspace:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/google-workspace/server.py"
        env: {}
      nextcloud:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/nextcloud/server.py"
        env: {}
      wwos:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/wwos/server.py"
        env: {}
      porkbun:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/porkbun/server.py"
        env: {}
      netbox:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/netbox/server.py"
        env:
          NETBOX_API: "http://netbox1.home.arpa:80"
      vikunja:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/vikunja/server.py"
        env: {}
      paperless:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/paperless/server.py"
        env: {}
      graylog:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/graylog/server.py"
        env: {}
      homeassistant:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/homeassistant/server.py"
        env:
          HASS_URL: "http://homeassistant.home.arpa/api/mcp"
      playwright:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/playwright/server.py"
        env:
          PLAYWRIGHT_BROWSER: "firefox"
          PLAYWRIGHT_HEADLESS: "true"
    mcp_standard_config_paths:
      - "/home/{{ gemini_user }}/.mcp.json"
      - "/home/{{ gemini_user }}/.gemini/antigravity-cli/mcp_config.json"
    mcp_opencode_config_path: "/home/{{ gemini_user }}/.config/opencode/opencode.jsonc"
    gemini_context:
      includeDirectories:
        - "{{ gemini_project_dir }}"
        - "{{ repo_path }}"
        - "/mnt/smb/share/Documents/will/gemini_projects"

  tasks:
    - name: 1. Check managed Python virtual environment metadata
      ansible.builtin.stat:
        path: "{{ venv_path }}/pyvenv.cfg"
      register: mcp_venv_metadata
      when: inventory_hostname != 'ynh2'

    - name: 2. Probe managed Python virtual environment
      ansible.builtin.command:
        argv:
          - "{{ venv_path }}/bin/python3"
          - -c
          - "import sys, mcp, pydantic; assert sys.prefix == '{{ venv_path }}'"
      register: mcp_venv_probe
      changed_when: false
      failed_when: false
      check_mode: no
      when:
        - inventory_hostname != 'ynh2'
        - mcp_venv_metadata.stat.exists

    - name: 3. Remove invalid managed Python virtual environment
      ansible.builtin.file:
        path: "{{ venv_path }}"
        state: absent
      when:
        - inventory_hostname != 'ynh2'
        - not mcp_venv_metadata.stat.exists or mcp_venv_probe.rc | default(1) != 0

    - name: 4. Create managed Python virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ venv_path }}"
      become: yes
      become_user: "{{ gemini_user }}"
      become_method: su
      when:
        - inventory_hostname != 'ynh2'
        - not mcp_venv_metadata.stat.exists or mcp_venv_probe.rc | default(1) != 0

    - name: 5. Install MCP Python Dependencies
      ansible.builtin.pip:
        name: 
          - fastmcp
          - requests
          - pynetbox==7.4.1
          - google-api-python-client
          - google-auth-oauthlib
          - google-auth-httplib2
        virtualenv: "{{ venv_path }}"
        state: present
      become: yes
      become_user: "{{ gemini_user }}"
      become_method: su
      when: inventory_hostname != 'ynh2'

    - name: 6. Assert managed Python virtual environment health
      ansible.builtin.command:
        argv:
          - "{{ venv_path }}/bin/python3"
          - -c
          - "import sys, mcp, pydantic; assert sys.prefix == '{{ venv_path }}'"
      changed_when: false
      check_mode: no
      when: inventory_hostname != 'ynh2'

    - name: 7. Ensure MCP configuration directories exist
      ansible.builtin.file:
        path: "{{ item | dirname }}"
        state: directory
        mode: '0755'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"
      loop: "{{ [gemini_project_dir + '/.gemini', mcp_opencode_config_path] + mcp_standard_config_paths }}"

    - name: 7a. Ensure project Gemini configuration directory exists
      ansible.builtin.file:
        path: "{{ gemini_project_dir }}/.gemini"
        state: directory
        mode: '0755'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"

    - name: 7b. Initialize missing standard MCP configurations
      ansible.builtin.copy:
        content: "{}\n"
        dest: "{{ item }}"
        mode: '0600'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"
        force: false
      loop: "{{ mcp_standard_config_paths }}"

    - name: 8. Read existing standard MCP configurations
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ mcp_standard_config_paths }}"
      register: mcp_standard_config_results
      no_log: true

    - name: 9. Render standard MCP configurations
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/standard-mcp.json.j2"
        dest: "{{ item.item }}"
        mode: '0600'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"
      loop: "{{ mcp_standard_config_results.results }}"
      vars:
        current_mcp_config: "{{ item.content | b64decode | from_json }}"
      no_log: true

    - name: 10. Read existing OpenCode MCP configuration
      ansible.builtin.slurp:
        src: "{{ mcp_opencode_config_path }}"
      register: mcp_opencode_config
      ignore_errors: true
      no_log: true

    - name: 11. Render OpenCode MCP configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/opencode-mcp.json.j2"
        dest: "{{ mcp_opencode_config_path }}"
        mode: '0600'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"
      vars:
        current_opencode_config: "{{ (mcp_opencode_config.content | b64decode | from_json) if mcp_opencode_config is success else {} }}"
      no_log: true

    - name: 12. Configure project-level Gemini settings
      ansible.builtin.copy:
        content: "{{ {'context': gemini_context, 'mcpServers': mcp_servers} | to_nice_json }}"
        dest: "{{ gemini_project_dir }}/.gemini/settings.json"
        mode: '0644'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"

    - name: 13. Deploy MCP Credentials to .bashrc
      ansible.builtin.blockinfile:
        path: "/home/{{ gemini_user }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR MCP CREDENTIALS"
        block: |
          export TRAC_PASSWORD='{{ vault_trac_user_password_will | default(trac_password) | default("") }}'
          export NEXTCLOUD_PASSWORD='{{ nextcloud_user_will_pass | default(nextcloud_password) | default("") }}'
          export WWOS_PASSWORD='{{ vault_wwos_password | default(wwos_password) | default("") }}'
          export NETBOX_TOKEN='{{ vault_netbox_token | default(netbox_api_token) | default("") }}'
          export NETBOX_API='http://netbox1.home.arpa:80'
          export HASS_TOKEN='{{ vault_hass_token | default(hass_token) | default("") }}'
          export HASS_URL='http://homeassistant.home.arpa/api/mcp'
      become: yes
      become_user: "{{ gemini_user }}"
      become_method: su

    - name: 13.5 Ensure tmp directory exists in repo
      ansible.builtin.file:
        path: "{{ repo_path }}/tmp"
        state: directory
        mode: '0755'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"

    - name: 14. Cache credentials in tmp/
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ repo_path }}/tmp/{{ item.name }}"
        mode: '0600'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"
      loop:
        - { name: 'trac_pass.txt', content: '{{ vault_trac_user_password_will | default(trac_password) | default("") }}' }
        - { name: 'nextcloud_pass.txt', content: '{{ nextcloud_user_will_pass | default(nextcloud_password) | default("") }}' }
        - { name: 'wwos_pass.txt', content: '{{ vault_wwos_password | default(wwos_password) | default("") }}' }
      no_log: true

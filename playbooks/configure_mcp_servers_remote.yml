---
# ==============================================================================
# Filename:       playbooks/configure_mcp_servers_remote.yml
# Version:        1.2
# Author:         Gemini CLI
# Last Modified:  2026-08-07
# Context:        http://trac.home.arpa/ticket/3214, http://trac.gafla.us.com/ticket/4123
#
# Purpose:
#   Provisions MCP servers for Gemini CLI on remote desktops.
#   Sets up the virtual environment, installs dependencies, and renders one
#   canonical MCP catalog for Claude, Antigravity, and OpenCode.
# ==============================================================================

- name: Configure MCP Servers on Remote Desktops
  hosts: "{{ mcp_target_hosts | default('desktops,agent_runners') }}"
  vars_files:
    - ../vault.yml
  vars:
    gemini_user: "will"
    repo_path: "/home/{{ gemini_user }}/ansible-netbox"
    gemini_project_dir: "/home/{{ gemini_user }}/gemini_projects"
    venv_path: "/home/{{ gemini_user }}/ansible-netbox/.venv"
    # The one managed catalog for custom Python MCP servers. Secret values stay
    # in the Ansible-managed shell environment, not in harness config files.
    mcp_servers:
      trac:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/trac/server.py"
        env:
          TRAC_URL: "http://trac.home.arpa/login/xmlrpc"
      google-workspace:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/google-workspace/server.py"
        env: {}
      nextcloud:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/nextcloud/server.py"
        env: {}
      wwos:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/wwos/server.py"
        env: {}
      porkbun:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/porkbun/server.py"
        env: {}
      netbox:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/netbox/server.py"
        env:
          NETBOX_API: "http://netbox1.home.arpa:80"
      vikunja:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/vikunja/server.py"
        env: {}
      paperless:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/paperless/server.py"
        env: {}
      graylog:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/graylog/server.py"
        env: {}
      homeassistant:
        type: stdio
        command: "{{ venv_path }}/bin/python3"
        args:
          - "{{ repo_path }}/mcp-servers/homeassistant/server.py"
        env:
          HASS_URL: "http://hass.home.arpa/api/mcp"
    mcp_standard_config_paths:
      - "/home/{{ gemini_user }}/.mcp.json"
      - "/home/{{ gemini_user }}/.gemini/antigravity-cli/mcp_config.json"
    mcp_opencode_config_path: "/home/{{ gemini_user }}/.config/opencode/opencode.jsonc"
    gemini_context:
      includeDirectories:
        - "{{ gemini_project_dir }}"
        - "{{ repo_path }}"
        - "/mnt/smb/share/Documents/will/gemini_projects"

  tasks:
    - name: 1. Ensure Python Venv exists
      ansible.builtin.command:
        cmd: "python3 -m venv {{ venv_path }}"
        creates: "{{ venv_path }}/pyvenv.cfg"
      become: yes
      become_user: "{{ gemini_user }}"
      become_method: su

    - name: 2. Install MCP Python Dependencies
      ansible.builtin.pip:
        name: 
          - fastmcp
          - requests
          - google-api-python-client
          - google-auth-oauthlib
          - google-auth-httplib2
        virtualenv: "{{ venv_path }}"
        state: present
      become: yes
      become_user: "{{ gemini_user }}"
      become_method: su
      when: inventory_hostname != 'ynh2'

    - name: 3. Ensure MCP configuration directories exist
      ansible.builtin.file:
        path: "{{ item | dirname }}"
        state: directory
        mode: '0755'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"
      loop: "{{ [gemini_project_dir + '/.gemini', mcp_opencode_config_path] + mcp_standard_config_paths }}"

    - name: 4. Read existing standard MCP configurations
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ mcp_standard_config_paths }}"
      register: mcp_standard_config_results
      no_log: true

    - name: 5. Render standard MCP configurations
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/standard-mcp.json.j2"
        dest: "{{ item.item }}"
        mode: '0600'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"
      loop: "{{ mcp_standard_config_results.results }}"
      vars:
        current_mcp_config: "{{ item.content | b64decode | from_json }}"
      no_log: true

    - name: 6. Read existing OpenCode MCP configuration
      ansible.builtin.slurp:
        src: "{{ mcp_opencode_config_path }}"
      register: mcp_opencode_config
      ignore_errors: true
      no_log: true

    - name: 7. Render OpenCode MCP configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/opencode-mcp.json.j2"
        dest: "{{ mcp_opencode_config_path }}"
        mode: '0600'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"
      vars:
        current_opencode_config: "{{ (mcp_opencode_config.content | b64decode | from_json) if mcp_opencode_config is success else {} }}"
      no_log: true

    - name: 8. Configure project-level Gemini settings
      ansible.builtin.copy:
        content: "{{ {'context': gemini_context, 'mcpServers': mcp_servers} | to_nice_json }}"
        dest: "{{ gemini_project_dir }}/.gemini/settings.json"
        mode: '0644'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"

    - name: 9. Deploy MCP Credentials to .bashrc
      ansible.builtin.blockinfile:
        path: "/home/{{ gemini_user }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR MCP CREDENTIALS"
        block: |
          export TRAC_PASSWORD='{{ vault_trac_user_password_will | default(trac_password) | default("") }}'
          export NEXTCLOUD_PASSWORD='{{ nextcloud_user_will_pass | default(nextcloud_password) | default("") }}'
          export WWOS_PASSWORD='{{ vault_wwos_password | default(wwos_password) | default("") }}'
          export NETBOX_TOKEN='{{ vault_netbox_token | default(netbox_api_token) | default("") }}'
          export NETBOX_API='http://netbox1.home.arpa:80'
          export HASS_TOKEN='{{ vault_hass_token | default(hass_token) | default("") }}'
          export HASS_URL='http://hass.home.arpa/api/mcp'
      become: yes
      become_user: "{{ gemini_user }}"
      become_method: su

    - name: 9.5 Ensure tmp directory exists in repo
      ansible.builtin.file:
        path: "{{ repo_path }}/tmp"
        state: directory
        mode: '0755'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"

    - name: 10. Cache credentials in tmp/
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ repo_path }}/tmp/{{ item.name }}"
        mode: '0600'
        owner: "{{ gemini_user }}"
        group: "{{ gemini_user }}"
      loop:
        - { name: 'trac_pass.txt', content: '{{ vault_trac_user_password_will | default(trac_password) | default("") }}' }
        - { name: 'nextcloud_pass.txt', content: '{{ nextcloud_user_will_pass | default(nextcloud_password) | default("") }}' }
        - { name: 'wwos_pass.txt', content: '{{ vault_wwos_password | default(wwos_password) | default("") }}' }
      no_log: true

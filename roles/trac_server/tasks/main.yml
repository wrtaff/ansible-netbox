# roles/trac_server/tasks/main.yml
# Idempotent service and configuration management role for Trac on Apache mod_wsgi.
---
- name: 1. Install System Dependencies
  ansible.builtin.apt:
    name:
      - python3-pip
      - apache2
      - libapache2-mod-wsgi-py3
      - sqlite3
    state: present
    update_cache: yes

- name: 2. Install Trac via pip
  ansible.builtin.pip:
    name: Trac
    executable: pip3
    extra_args: --break-system-packages

- name: 3. Deploy WSGI Script
  ansible.builtin.template:
    src: trac.wsgi.j2
    dest: /var/trac/trac.wsgi
    owner: www-data
    group: www-data
    mode: '0644'
  notify: Reload Apache

- name: 4. Deploy Apache VirtualHost Configuration
  ansible.builtin.template:
    src: trac-apache.conf.j2
    dest: /etc/apache2/sites-available/trac.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: 5. Enable Apache VirtualHost
  ansible.builtin.command: a2ensite trac.conf
  args:
    creates: /etc/apache2/sites-enabled/trac.conf
  notify: Reload Apache

- name: 6. Enable mod_wsgi
  ansible.builtin.command: a2enmod wsgi
  args:
    creates: /etc/apache2/mods-enabled/wsgi.load
  notify: Restart Apache

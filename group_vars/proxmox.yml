    name: "Graylog Daily"
    node: "pve2"
    schedule: "01:00"
    storage: "pbs01"
    mode: "snapshot"
    vmid: "100"
    notes_template: !unsafe "{{guestname}}"
    enabled: true
    mailto: "root@home.arpa"
    mailnotification: "failure"


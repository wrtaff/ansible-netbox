---
- name: Provision the Gmailctl validator
  hosts: gmailctl-ansible
  become: true
  vars:
    gmailctl_version: "0.12.0"
    gmailctl_archive: "gmailctl_{{ gmailctl_version }}_linux_amd64.tar.gz"
    gmailctl_url: "https://github.com/mbrt/gmailctl/releases/download/v{{ gmailctl_version }}/{{ gmailctl_archive }}"
    gmailctl_sha256: "2ebd25399ce8eff9698b33058754f9dbc9a80ef63503cfb92e4ec691d394ecae"
    gmailctl_download: "/var/tmp/{{ gmailctl_archive }}"

  tasks:
    - name: Require the supported Gmailctl host architecture
      ansible.builtin.assert:
        that: ansible_architecture == "x86_64"
        fail_msg: "Gmailctl v{{ gmailctl_version }} provisioning currently supports linux amd64 only."

    - name: Download pinned Gmailctl release
      ansible.builtin.get_url:
        url: "{{ gmailctl_url }}"
        dest: "{{ gmailctl_download }}"
        checksum: "sha256:{{ gmailctl_sha256 }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install Gmailctl validator
      ansible.builtin.unarchive:
        src: "{{ gmailctl_download }}"
        dest: /usr/local/bin
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Verify Gmailctl validator version
      ansible.builtin.command: /usr/local/bin/gmailctl version
      register: gmailctl_version_output
      changed_when: false
      failed_when: "gmailctl_version not in gmailctl_version_output.stdout"

    # --- Trac #4570 WP-3: default config path must resolve to the canonical SSOT ---
    # Historically /root/.gmailctl/config.jsonnet symlinked into /opt/config-repo,
    # a separate GitHub-backed checkout that drifted ~512 lines behind live Gmail.
    # A bare `gmailctl apply` against it would have deleted ~35 filters / ~36 labels.
    # /etc/gmailctl/config.jsonnet is pushed from ansible-netbox/gmailctl/config.jsonnet
    # by roles/gmailctl_drift_check. Credentials (credentials.json, token.json) stay
    # in /root/.gmailctl, so only the config file is redirected.
    - name: Ensure gmailctl config directory exists
      ansible.builtin.file:
        path: /root/.gmailctl
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Require the Ansible-managed canonical config to be present
      ansible.builtin.stat:
        path: /etc/gmailctl/config.jsonnet
      register: gmailctl_canonical

    - name: Fail fast if the canonical config has not been deployed
      ansible.builtin.assert:
        that: gmailctl_canonical.stat.exists
        fail_msg: >-
          /etc/gmailctl/config.jsonnet is missing. Run
          playbooks/deploy_gmailctl_drift_check.yml first -- it pushes the
          canonical config. Refusing to point gmailctl at a nonexistent file.

    - name: Point default gmailctl config at the canonical managed copy
      ansible.builtin.file:
        src: /etc/gmailctl/config.jsonnet
        dest: /root/.gmailctl/config.jsonnet
        state: link
        force: true
        owner: root
        group: root

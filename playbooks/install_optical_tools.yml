---
# ==============================================================================
# Filename:       playbooks/install_optical_tools.yml
# Version:        1.0
# Author:         opencode
# Last Modified:  2026-08-20
# Trac Ticket:    #4371
#
# Purpose:
#     Installs optical disc burning tools (xorriso, dvd+rw-tools, wodim)
#
# Use Case:
#     Enables burning ISO images to CD/DVD/BD media for bare-metal OS installation
#
# Installation Method:
#     apt package manager
#
# Prerequisites:
#     - Debian/Ubuntu based OS
#
# Secrets:
#     ansible_become_pass  (vault.yml)
#
# Usage:
#     ansible-playbook -i inventory.ini playbooks/install_optical_tools.yml --limit limbo-f0
# ==============================================================================

- name: Install Optical Disc Tools
  hosts: "{{ target_hosts | default('desktops') }}"
  become: yes
  vars_files:
    - ../vault.yml
  tasks:
    - name: Ensure optical disc burning packages are installed
      ansible.builtin.apt:
        name:
          - xorriso
          - dvd+rw-tools
          - wodim
        state: present
        update_cache: yes

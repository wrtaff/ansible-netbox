# ==============================================================================
# Filename:       roles/browser_baseline/defaults/main.yml
# Version:        1.1
# Author:         Pops AI / Gemini
# Last Modified:  2026-08-31
# Trac Tickets:   #2783, #4407, #4408, #4409, #4410, #4411
#
# Purpose:
#     Default variables for the browser_baseline Ansible role.
# ==============================================================================
---
# Feature toggles
browser_baseline_manage_chrome: true
browser_baseline_manage_firefox: true
browser_baseline_manage_dillo: true

# Target user for user-level dotfile/config placement (e.g. Dillo, Firefox profiles)
browser_baseline_user: "will"

# ------------------------------------------------------------------------------
# Common Bookmarks (shared across Chrome, Firefox, and Dillo)
# ------------------------------------------------------------------------------
browser_baseline_common_bookmarks:
  - name: "WWOS"
    url: "http://wwos.home.arpa"
  - name: "Trac"
    url: "http://trac.gafla.us.com"
  - name: "NetBox"
    url: "http://netbox1.home.arpa"
  - name: "Paperless-ngx"
    url: "http://paperless-ngx.home.arpa"
  - name: "Vikunja"
    url: "http://192.168.0.127"
  - name: "Wallabag"
    url: "http://192.168.0.103"
  - name: "Wikipedia"
    url: "https://en.wikipedia.org"

# ------------------------------------------------------------------------------
# Common Search Shortcut Keys (shared across Chrome, Firefox, and Dillo)
# ------------------------------------------------------------------------------
browser_baseline_search_shortcuts:
  - name: "WWOS"
    keyword: "ww"
    url_template: "http://wwos.home.arpa/index.php?search={searchTerms}"
    dillo_url: "http://wwos.home.arpa/index.php?search=%s"
    icon_url: "http://wwos.home.arpa/favicon.ico"
  - name: "Trac"
    keyword: "trac"
    url_template: "http://trac.gafla.us.com/search?q={searchTerms}&changeset=on&milestone=on&ticket=on&wiki=on"
    dillo_url: "http://trac.gafla.us.com/search?q=%s&changeset=on&milestone=on&ticket=on&wiki=on"
    icon_url: "http://trac.gafla.us.com/chrome/common/trac.ico"
  - name: "Wikipedia"
    keyword: "wik"
    url_template: "https://en.wikipedia.org/w/index.php?search={searchTerms}&go=Go"
    dillo_url: "https://en.wikipedia.org/w/index.php?search=%s&go=Go"
    icon_url: "https://en.wikipedia.org/favicon.ico"

# ------------------------------------------------------------------------------
# Chrome Configuration & Policy
# ------------------------------------------------------------------------------
chrome_deb_url: "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
chrome_policy_dir: "/etc/opt/chrome/policies/managed"
chrome_policy_file: "{{ chrome_policy_dir }}/default_policies.json"

# Chrome Extension IDs:
# - Bitwarden: nngceckbapebfimnlniiiahkandclblb
# - Wallabag: pelehflaaofaepelocifahojgipgndoc
chrome_extension_install_forcelist:
  - "nngceckbapebfimnlniiiahkandclblb;https://clients2.google.com/service/update2/crx"
  - "pelehflaaofaepelocifahojgipgndoc;https://clients2.google.com/service/update2/crx"

# ------------------------------------------------------------------------------
# Firefox Configuration & Policy
# ------------------------------------------------------------------------------
firefox_package_name: "firefox-esr"
firefox_policy_dir: "/etc/firefox/policies"
firefox_policy_file: "{{ firefox_policy_dir }}/policies.json"

# Firefox Extension IDs and URLs:
# - Bitwarden: {446900e4-71c2-419f-a6a7-df9c091e268b}
# - Wallabag: {6026a0c5-5b4a-49ae-8692-a1f94c4eed83}
firefox_extensions_install:
  - "https://addons.mozilla.org/firefox/downloads/latest/bitwarden-password-manager/latest.xpi"
  - "https://addons.mozilla.org/firefox/downloads/latest/wallabag-v2/latest.xpi"

firefox_extension_settings:
  "{446900e4-71c2-419f-a6a7-df9c091e268b}":
    installation_mode: "normal_installed"
    install_url: "https://addons.mozilla.org/firefox/downloads/latest/bitwarden-password-manager/latest.xpi"
  "{6026a0c5-5b4a-49ae-8692-a1f94c4eed83}":
    installation_mode: "normal_installed"
    install_url: "https://addons.mozilla.org/firefox/downloads/latest/wallabag-v2/latest.xpi"

# Firefox Named Profiles (concurrent isolation)
firefox_named_profiles:
  - name: "firefox-esr"
    path: "firefox-esr"
    display_name: "Firefox ESR (Default)"
    is_default: true
    cmd_name: "firefox-esr"
  - name: "ff-remote-0"
    path: "ff-remote-0"
    display_name: "Firefox (Remote 0)"
    is_default: false
    cmd_name: "ff-remote-0"
  - name: "ff-remote-1"
    path: "ff-remote-1"
    display_name: "Firefox (Remote 1)"
    is_default: false
    cmd_name: "ff-remote-1"
  - name: "ff-remote-2"
    path: "ff-remote-2"
    display_name: "Firefox (Remote 2)"
    is_default: false
    cmd_name: "ff-remote-2"

# ------------------------------------------------------------------------------
# Dillo Configuration
# ------------------------------------------------------------------------------
dillo_package_name: "dillo"

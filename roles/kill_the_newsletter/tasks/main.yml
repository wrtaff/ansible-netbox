---
- name: Install managed Node.js runtime
  ansible.builtin.include_role:
    name: nodejs

- name: Install KTN build dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - git
      - pkg-config
    state: present
    update_cache: true

- name: Create KTN service group
  ansible.builtin.group:
    name: "{{ ktn_group }}"
    system: true

- name: Create KTN service account
  ansible.builtin.user:
    name: "{{ ktn_user }}"
    group: "{{ ktn_group }}"
    system: true
    home: "/var/lib/{{ ktn_user }}"
    create_home: false

- name: Create KTN state and TLS directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ktn_data_directory }}", owner: "{{ ktn_user }}", group: "{{ ktn_group }}", mode: "0750" }

- name: Fetch pinned KTN source
  ansible.builtin.git:
    repo: "{{ ktn_repository }}"
    dest: "{{ ktn_root }}"
    version: "{{ ktn_version }}"
    force: true
  register: ktn_source

- name: Allow unprivileged KTN SMTP port configuration
  ansible.builtin.replace:
    path: "{{ ktn_root }}/source/index.mts"
    regexp: "application\\.email\\.listen\\(25\\);"
    replace: "application.email.listen(Number(process.env.SMTP_PORT ?? {{ ktn_smtp_port }}));"
  register: ktn_smtp_patch

- name: Check whether KTN dependencies are installed
  ansible.builtin.stat:
    path: "{{ ktn_root }}/node_modules"
  register: ktn_node_modules

- name: Install KTN Node dependencies
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ ktn_root }}"
  when: ktn_source.changed or ktn_smtp_patch.changed or not ktn_node_modules.stat.exists
  changed_when: true

- name: Build KTN application
  ansible.builtin.command: npm run prepare
  args:
    chdir: "{{ ktn_root }}"
  when: ktn_source.changed or ktn_smtp_patch.changed
  changed_when: true

- name: Write KTN runtime configuration
  ansible.builtin.template:
    src: configuration.mjs.j2
    dest: "/etc/kill-the-newsletter.mjs"
    owner: root
    group: "{{ ktn_group }}"
    mode: "0640"
  notify: Restart KTN

- name: Install KTN service unit
  ansible.builtin.template:
    src: kill-the-newsletter.service.j2
    dest: "/etc/systemd/system/kill-the-newsletter.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart KTN

- name: Remove obsolete local TLS certificate machinery
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/refresh-ktn-tailscale-cert
    - /etc/systemd/system/ktn-tailscale-cert.service
    - /etc/systemd/system/ktn-tailscale-cert.timer
    - /etc/ssl/tailscale/ktn-lxc-01.van-bee.ts.net

- name: Disable obsolete KTN certificate refresh timer
  ansible.builtin.systemd:
    name: ktn-tailscale-cert.timer
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false

- name: Enable and start KTN service
  ansible.builtin.systemd:
    name: kill-the-newsletter.service
    enabled: true
    state: started
    daemon_reload: true

- name: Apply KTN configuration before enabling the public proxy
  ansible.builtin.meta: flush_handlers

- name: Configure Tailnet HTTPS proxy to KTN
  ansible.builtin.command: >
    tailscale serve --bg --https=443 http://127.0.0.1:{{ ktn_http_port }}
  changed_when: false

- name: Wait for KTN SMTP listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ktn_smtp_port }}"
    timeout: 60

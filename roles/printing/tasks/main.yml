# ==============================================================================
# Filename:       roles/printing/tasks/main.yml
# Version:        1.1
# Author:         Gemini CLI
# Last Modified:  2026-09-29
# Trac Ticket:    #4795 (Overhaul network printing: eliminate duplicate printer advertisements)
#
# Purpose:
#     Main task file for configuring CUPS and lab network printer queues.
# ==============================================================================
---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - printing_setup

- name: Install CUPS and printer driver packages
  ansible.builtin.apt:
    name: "{{ printing_packages }}"
    state: present
  tags:
    - printing_setup

- name: Create Google Drive uploader group
  ansible.builtin.group:
    name: "{{ gdrive_uploader_group }}"
    system: yes
    state: present
  tags:
    - gdrive_printing_setup
  when: gdrive_print_enabled | default(false) | bool

- name: Create Google Drive uploader user
  ansible.builtin.user:
    name: "{{ gdrive_uploader_user }}"
    group: "{{ gdrive_uploader_group }}"
    system: yes
    shell: /usr/sbin/nologin
    create_home: no
    state: present
  tags:
    - gdrive_printing_setup
  when: gdrive_print_enabled | default(false) | bool

- name: Create Google Drive spool directories
  ansible.builtin.file:
    path: "{{ gdrive_spool_root }}/{{ item }}"
    state: directory
    owner: root
    group: "{{ gdrive_uploader_group }}"
    mode: '0775'
  loop:
    - incoming
    - processing
    - completed
    - quarantine
    - state
  tags:
    - gdrive_printing_setup
  when: gdrive_print_enabled | default(false) | bool

- name: Install Google API client Python packages for spool uploader
  ansible.builtin.apt:
    name:
      - python3-google-auth
      - python3-googleapi
    state: present
  when: gdrive_print_enabled | default(false) | bool
  tags:
    - gdrive_printing_setup

- name: Install cups-pdf package for Google Drive printing
  ansible.builtin.apt:
    name: printer-driver-cups-pdf
    state: present
  when: gdrive_print_enabled | default(false) | bool
  tags:
    - gdrive_printing_setup

- name: Configure cups-pdf output for Google Drive printing
  ansible.builtin.template:
    src: cups-pdf.conf.j2
    dest: /etc/cups/cups-pdf.conf
    owner: root
    group: root
    mode: '0644'
  when: gdrive_print_enabled | default(false) | bool
  notify: Restart cups
  tags:
    - gdrive_printing_setup

- name: Register Google Drive CUPS-PDF queue
  ansible.builtin.command: >-
    lpadmin -p {{ gdrive_queue_name }}
    -v cups-pdf:/
    -m lsb/usr/cups-pdf/CUPS-PDF_opt.ppd
    -E
  args:
    creates: "/etc/cups/ppd/{{ gdrive_queue_name }}.ppd"
  tags:
    - gdrive_printing_setup
  when: gdrive_print_enabled | default(false) | bool

- name: Install Google Drive spool uploader
  ansible.builtin.copy:
    src: gdrive_spool_uploader.py
    dest: /usr/local/bin/gdrive_spool_uploader.py
    owner: root
    group: root
    mode: '0755'
  tags:
    - gdrive_printing_setup
  when: gdrive_print_enabled | default(false) | bool

- name: Install Google Drive spool watcher units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - gdrive-spool-watcher.path
    - gdrive-spool-watcher.service
    - gdrive-spool-failure.service
  tags:
    - gdrive_printing_setup
  when: gdrive_print_enabled | default(false) | bool

- name: Ensure CUPS services are running and enabled at boot
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop: "{{ printing_services }}"
  tags:
    - printing_setup

- name: Manage cups-browsed service state
  ansible.builtin.systemd:
    name: cups-browsed
    state: "{{ 'started' if enable_cups_browsed | bool else 'stopped' }}"
    enabled: "{{ enable_cups_browsed | bool }}"
  tags:
    - printing_setup

- name: Configure CUPS browsing and sharing mode
  ansible.builtin.lineinfile:
    path: /etc/cups/cupsd.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: yes
  loop:
    - regexp: '^#?Browsing\s+'
      line: "Browsing {{ 'Yes' if enable_cups_sharing | bool else 'No' }}"
    - regexp: '^#?BrowseLocalProtocols\s+'
      line: "BrowseLocalProtocols {{ 'dnssd' if enable_cups_sharing | bool else 'none' }}"
    - regexp: '^#?DefaultShared\s+'
      line: "DefaultShared {{ 'Yes' if enable_cups_sharing | bool else 'No' }}"
  notify: Restart cups
  tags:
    - printing_config

- name: Configure CUPS web interface listening (if enabled)
  ansible.builtin.lineinfile:
    path: /etc/cups/cupsd.conf
    regexp: '^#?Listen 0.0.0.0:631'
    line: 'Listen 0.0.0.0:631'
    backup: yes
  when: enable_cups_web_access | bool
  notify: Restart cups
  tags:
    - printing_config

- name: Allow CUPS web interface administration from local network (if enabled)
  ansible.builtin.blockinfile:
    path: /etc/cups/cupsd.conf
    block: |
      <Location />
        Order allow,deny
        Allow @LOCAL
      </Location>
      <Location /admin>
        Order allow,deny
        Allow @LOCAL
      </Location>
      <Location /admin/conf>
        AuthType Basic
        Require user @SYSTEM
        Order allow,deny
        Allow @LOCAL
      </Location>
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR CUPS LOCAL ACCESS"
    backup: yes
  when: enable_cups_web_access | bool
  notify: Restart cups
  tags:
    - printing_config

- name: Copy role PPD files to target workstation
  ansible.builtin.copy:
    src: "{{ item.ppd_file }}"
    dest: "/tmp/{{ item.ppd_target_filename }}"
    mode: '0644'
  when: item.ppd_file is defined and item.ppd_file != ''
  loop: "{{ printers }}"
  loop_control:
    loop_var: item
  tags:
    - printing_config

- name: Add network printers using lpadmin
  ansible.builtin.command: >-
    lpadmin -p {{ item.name }}
    -v {{ item.device_uri }}
    -E
    -o printer-is-shared={{ 'true' if enable_cups_sharing | bool else 'false' }}
    {% if item.device_uri.startswith('ipp://') %}
    -m everywhere
    {% elif item.ppd_file is defined and item.ppd_file != '' %}
    -P /tmp/{{ item.ppd_target_filename }}
    {% else %}
    -m raw
    {% endif %}
  args:
    creates: "/etc/cups/ppd/{{ item.name }}.ppd"
  register: add_printer_result
  changed_when: add_printer_result.rc != 0 and "printer already exists" not in add_printer_result.stderr
  failed_when: add_printer_result.rc != 0 and "printer already exists" not in add_printer_result.stderr
  loop: "{{ printers }}"
  tags:
    - printing_config

- name: Enforce printer sharing policy on configured queues
  ansible.builtin.command: >-
    lpadmin -p {{ item.name }} -o printer-is-shared={{ 'true' if enable_cups_sharing | bool else 'false' }}
  changed_when: false
  loop: "{{ printers }}"
  tags:
    - printing_config

- name: Register client Print_to_Google_Drive network queue
  ansible.builtin.command: >-
    lpadmin -p {{ gdrive_queue_name }}
    -v ipp://cups.home.arpa:631/printers/{{ gdrive_queue_name }}
    -E
    -m everywhere
    -o printer-is-shared=false
  args:
    creates: "/etc/cups/ppd/{{ gdrive_queue_name }}.ppd"
  when: not (gdrive_print_enabled | default(false) | bool)
  tags:
    - printing_config

- name: Enforce printer sharing policy on client Print_to_Google_Drive queue
  ansible.builtin.command: >-
    lpadmin -p {{ gdrive_queue_name }} -o printer-is-shared=false
  changed_when: false
  when: not (gdrive_print_enabled | default(false) | bool)
  tags:
    - printing_config

- name: Clean up temporary PPD files on target workstation
  ansible.builtin.file:
    path: "/tmp/{{ item.ppd_target_filename }}"
    state: absent
  when: item.ppd_file is defined and item.ppd_file != ''
  loop: "{{ printers }}"
  loop_control:
    loop_var: item
  tags:
    - printing_cleanup

- name: Remove known stale or duplicate cups-browsed queues on client workstations
  ansible.builtin.command: "lpadmin -x {{ item }}"
  loop:
    - "0-HP-LaserJet-P2055dn-with-Duplexer"
    - "0-HP_LaserJet_P2055dn_with_Duplexer"
    - "HP_OfficeJet_Pro_9010_series_60AC50"
    - "41HP_OfficeJet_Pro_9010_series_60AC50"
    - "PDF"
  failed_when: false
  changed_when: false
  when: not (gdrive_print_enabled | default(false) | bool)
  tags:
    - printing_cleanup

- name: Set default printer queue
  ansible.builtin.command: "lpoptions -d {{ item.name }}"
  changed_when: true
  when: item.is_default | default(false) | bool
  loop: "{{ printers }}"
  tags:
    - printing_config

- name: Ensure Google Drive spool watcher path unit is running and enabled
  ansible.builtin.systemd:
    name: gdrive-spool-watcher.path
    state: started
    enabled: yes
    daemon_reload: yes
  when: gdrive_print_enabled | default(false) | bool
  tags:
    - gdrive_printing_setup

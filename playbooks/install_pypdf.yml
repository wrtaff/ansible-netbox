---
# ==============================================================================
# Filename:       playbooks/install_pypdf.yml
# Version:        1.0
# Author:         opencode (jimmy, ar0)
# Last Modified:  2026-07-25
# Trac Ticket:    #4042 (Implement PDF form-filling automation for GA POA documents)
#
# Purpose:
#     Install the pypdf Python library so agent runners can fill GA statutory
#     POA AcroForms per skills/domain/pdf-editor.md and Trac #4042 (WP2).
#
# Use Case:
#     fill_ga_poa.py fills named AcroForm fields on the canonical State of
#     Georgia (DCA) fillable POA template:
#         from pypdf import PdfReader, PdfWriter
#         writer.update_page_form_field_values(page, {...}, auto_regenerate=False)
#
# Installation Method:
#     apt package python3-pypdf. Debian bookworm ships pypdf 3.4.1, which
#     supports update_page_form_field_values with auto_regenerate. If a newer
#     pypdf feature is required (e.g. PdfWriter(clone_from=...) or the flatten=
#     kwarg, both added in pypdf >= 4.x), switch this playbook to a pinned pip
#     install inside the agent-runner venv instead of apt. The WP3 script is
#     written to the 3.4.1 API to avoid that dependency where possible.
#
# Prerequisites:
#     - Debian/Ubuntu system
#
# Configuration:
#     - None
#
# Secrets:
#     None -- no vault variables required
#
# Usage:
#     # Dry run first
#     ansible-playbook -i inventory.ini playbooks/install_pypdf.yml \
#         --limit <host> --check --diff
#
#     # Live run
#     ansible-playbook -i inventory.ini playbooks/install_pypdf.yml \
#         --limit <host>
#
# Removal Instructions:
#     apt remove python3-pypdf
#
# Revision History:
#     1.0 - Initial playbook (Trac #4042 WP2).
#
# NOTES:
#     Always bump versions when making changes and annotate them here.
#     Imported by provision_agent_runner.yml so it fans out to the whole fleet.
#
# WWOS:   http://wwos.home.arpa/index.php/Playbooks/install_pypdf.yml
# GitHub: https://github.com/wrtaff/ansible-netbox/blob/master/playbooks/install_pypdf.yml
# ==============================================================================

- name: Install pypdf
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache and install python3-pypdf
      ansible.builtin.apt:
        name:
          - python3-pypdf
        state: present
        update_cache: yes
      when: inventory_hostname != 'ynh2'

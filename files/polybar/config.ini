[colors]
background = #282A36
background-alt = #44475A
foreground = #F8F8F2
primary = #BD93F9
secondary = #8BE9FD
alert = #FF5555
disabled = #6272A4
green = #50FA7B

[bar/main]
monitor = ${env:MONITOR:}
bottom = true
width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = monospace:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=10;2
font-2 = Font Awesome 6 Brands:style=Regular:size=10;2
font-3 = Noto Color Emoji:scale=10;2

modules-left = xworkspaces xwindow
modules-right = filesystem memory cpu eth date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/primary]
inherit = bar/main
tray-position = right
tray-maxsize = 16
tray-padding = 2

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
format-mounted = <label-mounted> <bar-used>
label-mounted = %{F#BD93F9}root%{F-} %percentage_used%%
bar-used-width = 8
bar-used-foreground-0 = #50FA7B
bar-used-foreground-1 = #F1FA8C
bar-used-foreground-2 = #FFB86C
bar-used-foreground-3 = #FF5555
bar-used-indicator = |
bar-used-indicator-foreground = #F8F8F2
bar-used-fill = █
bar-used-empty = ░
bar-used-empty-foreground = #6272A4

[module/memory]
type = internal/memory
interval = 2
format = <label> <bar-used>
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%
bar-used-width = 8
bar-used-foreground-0 = #50FA7B
bar-used-foreground-1 = #F1FA8C
bar-used-foreground-2 = #FFB86C
bar-used-foreground-3 = #FF5555
bar-used-indicator = |
bar-used-indicator-foreground = #F8F8F2
bar-used-fill = █
bar-used-empty = ░
bar-used-empty-foreground = #6272A4

[module/cpu]
type = internal/cpu
interval = 2
format = <label> <ramp-coreload>
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage%%
ramp-coreload-spacing = 1
ramp-coreload-0 =  
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █
ramp-coreload-0-foreground = #50FA7B
ramp-coreload-1-foreground = #50FA7B
ramp-coreload-2-foreground = #50FA7B
ramp-coreload-3-foreground = #F1FA8C
ramp-coreload-4-foreground = #F1FA8C
ramp-coreload-5-foreground = #FFB86C
ramp-coreload-6-foreground = #FF5555
ramp-coreload-7-foreground = #FF5555

[module/eth]
type = internal/network
interface-type = wired
interval = 3.0
format-connected = <label-connected>
format-connected-prefix = "ETH "
format-connected-prefix-foreground = ${colors.green}
label-connected = %local_ip% (%netspeed%)
format-disconnected =

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S
format = <label>
format-prefix = ""
label = %date%
label-foreground = ${colors.secondary}
click-right = ~/.config/polybar/copy_timestamp.sh

[settings]
screenchange-reload = true
pseudo-transparency = true

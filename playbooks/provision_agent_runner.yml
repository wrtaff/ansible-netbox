---
# Filename:       playbooks/provision_agent_runner.yml
# Version:        2.0
# Author:         Antigravity
# Last Modified:  2026-08-17
# Trac Ticket:    #3829, #3774, #3838, #3949, #4042, #4033, #4029, #4186, #4308
#
# Update 2.0:
#     - Deploy systemd drop-ins for apt-daily.service and apt-daily-upgrade.service
#       to clear the failing wait-online ExecStartPre helper on Debian LXCs (Trac #4308).
#
# Update 1.9:
#     - Enforce the fleet timezone for runner provisioning from the shared
#       `system_timezone` variable (Trac #4186). This is intentionally scoped
#       here instead of importing the broad system_common role, so desktop
#       provisioning remains on its own path.
#
# Update 1.8:
#     - Stage the current agent-sync-check.sh outside existing checkouts and
#       run it before steady-state fast-forward tasks (Trac #4029). This lets
#       clean, completed agent branches recover and pull the merged script
#       without rsyncing over an existing repository's refs, stash, or worktree.
#
# Update 1.7:
#     - Add a raw/ remote-correction task mirroring the existing wiki/ one
#       (Trac #4033 Phase 3). `pops-raw.git` now exists on athena as the hub
#       for raw/, cloned fleet-wide (manually, same as wiki/ originally was --
#       this playbook still does not perform the clone itself, only corrects
#       the remote URL where a clone already exists). Supersedes the Update
#       1.3 claim that "wiki/ and raw/ remain athena-only by design" -- that
#       was true until #4033; both are now cloned fleet-wide.
#
# Update 1.6:
#     - Import install_pypdf.yml so agent runners can fill GA POA AcroForms
#       (Trac #4042 WP2).
#
# Update 1.5:
#     - Import install_yt_dlp.yml so agent runners can intake YouTube sources
#       for the research skill (Trac #3949).
#
# Purpose:
#     Unified playbook to fully provision a new AI agent runner LXC container
#     (or bare metal host). Automates repository cloning, bashrc templating with secrets,
#     agent installations, netbox registration, and passwordless SSH configuration.
#
# Update 1.4:
#     - Add athena's SSH host key to known_hosts wherever a wiki/ clone exists (Trac #3838).
#       LXC clones (ar0, ar1) inherit a `Host *.home.arpa` / StrictHostKeyChecking accept-new
#       block baked into the VMID 117 template, but non-LXC hosts (titan2) never get it, so
#       non-interactive git operations against the `athena` remote failed host key verification
#       even after the remote URL itself was corrected.
#
# Update 1.3:
#     - Correct the wiki repo `athena` remote to an SSH URL where a wiki/ clone
#       already exists on the target (Trac #3838). Does not clone wiki/ itself —
#       wiki/ and raw/ remain athena-only by design (see AGENTS.md, agent-runner.md).
#
# Update 1.2:
#     - Deploy lab SSH private key and SSH config for passwordless connections (Trac #3829).
#
# Update 1.1:
#     - Synced with upstream playbooks 2026-07-08 to fix sudo timeouts and npm pathing.
#
# Use Case:
#     Eliminates configuration drift and manual SSH steps when scaling the agent fleet.
#
# Installation Method:
#     Ansible playbook invoking tasks and importing component playbooks.
#
# Prerequisites:
#     Host must be accessible via SSH (usually after cloning from VMID 117 template).
#
# Configuration:
#     Templates ~/.bashrc for the `will` user.
#
# Secrets:
#                   netbox_api_token (vault.yml) — writes tags/entries to NetBox
#                   wwos_password (vault.yml)
#                   trac_password (vault.yml)
#                   nextcloud_password (vault.yml)
#                   gemini_api_key (vault.yml)
#                   anthropic_api_key (vault.yml)
#                   openrouter_api_key (vault.yml)
#
# Usage:
#     ansible-playbook -i inventory.ini playbooks/provision_agent_runner.yml --limit <host>
#
# Removal Instructions:
#     Destroy the target LXC container.
#
# WWOS:
#     http://wwos.home.arpa/index.php/Playbooks/provision_agent_runner.yml
# GitHub:
#     https://github.com/wrtaff/ansible-netbox/blob/main/playbooks/provision_agent_runner.yml

- name: Provision Agent Runner Environment
  hosts: all
  become: yes
  vars_files:
    - ../vault.yml
  vars:
    target_user: will
    target_home: "/home/{{ target_user }}"

  tasks:
    - name: Set agent runner system timezone from group_vars
      community.general.timezone:
        name: "{{ system_timezone }}"

    - name: Ensure target user exists
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /bin/bash
        state: present

    - name: Ensure Trac and NetBox DNS overrides are present in /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          192.168.0.144 trac.home.arpa trac.gafla.us.com
          192.168.0.102 netbox.home.arpa netbox1.home.arpa
        state: present
      become: yes

    - name: Deploy lab SSH public key to target user
      ansible.posix.authorized_key:
        user: "{{ target_user }}"
        state: present
        key: "{{ ssh_lab_pub_key }}"
        exclusive: no
      when: ssh_lab_pub_key is defined

    - name: Deploy lab SSH private key to target user
      ansible.builtin.copy:
        src: "/home/will/.ssh/id_rsa_lab"
        dest: "{{ target_home }}/.ssh/id_rsa_lab"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0600'
      become: yes

    - name: Configure SSH client to use lab key by default
      ansible.builtin.blockinfile:
        path: "{{ target_home }}/.ssh/config"
        create: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0600'
        marker: "# {mark} ANSIBLE MANAGED BLOCK: Default Lab Key"
        block: |
          Host *
              IdentityFile ~/.ssh/id_rsa_lab
              IdentityFile ~/.ssh/id_rsa
              IdentityFile ~/.ssh/id_ed25519
      become: yes

    - name: Ensure git and rsync are installed
      ansible.builtin.apt:
        name: 
          - git
          - rsync
        state: present
        update_cache: yes
      when: inventory_hostname != 'ynh2'

    - name: Configure global git identity for target user
      community.general.git_config:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        scope: global
      become: yes
      become_user: "{{ target_user }}"
      loop:
        - { key: "user.name", value: "will" }
        - { key: "user.email", value: "wrtaff@gmail.com" }
        - { key: "init.defaultBranch", value: "main" }
        - { key: "pull.rebase", value: "true" }

    - name: Check if pops git repository exists on target
      ansible.builtin.stat:
        path: "{{ target_home }}/pops/.git"
      register: pops_git_stat

    - name: Check if ansible-netbox git repository exists on target
      ansible.builtin.stat:
        path: "{{ target_home }}/ansible-netbox/.git"
      register: netbox_git_stat

    # Trac #4054/#4068 fan-out incident: this task previously ran on every
    # play against every non-ynh2 host regardless of whether the repo already
    # existed (`inventory_hostname != 'ynh2' or not ...stat.exists` is true
    # unconditionally for those hosts). rsync --archive syncs the *entire*
    # tree including .git, so a repeat run overwrote each host's own HEAD
    # reflog, branch refs, and refs/stash with athena's -- confirmed on ar0
    # (4 of 7 stashes lost) and ar1 during the 2026-07-28 fan-out. Gated to
    # first-time bootstrap only; ongoing propagation is the git-based
    # session-start pull (agent-sync-check.sh) that skills/domain/agent-runner.md
    # already documents as the steady-state mechanism.
    - name: Synchronize pops repository from control node (bootstrap only)
      ansible.posix.synchronize:
        src: "/home/will/pops/"
        dest: "{{ target_home }}/pops/"
        archive: yes
      become: no
      when: not pops_git_stat.stat.exists

    - name: Synchronize ansible-netbox repository from control node (bootstrap only)
      ansible.posix.synchronize:
        src: "/home/will/ansible-netbox/"
        dest: "{{ target_home }}/ansible-netbox/"
        archive: yes
        rsync_opts:
          - "--exclude=.venv"
      become: no
      when: not netbox_git_stat.stat.exists

    - name: Ensure repository ownership
      ansible.builtin.file:
        path: "{{ target_home }}/{{ item }}"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        recurse: yes
      loop:
        - pops
        - ansible-netbox

    # Git hooks are NOT carried by `git clone`, so they must be installed per
    # repo per host. Previously hand-symlinked, which is why coverage drifted
    # across the fleet and conflict markers reached trunk (Trac #4380 WP-1).
    # The installer is idempotent; --check reports without changing anything.
    - name: Install Pops git hooks (trunk guard + conflict-marker guard)
      ansible.builtin.command:
        cmd: "{{ target_home }}/pops/scripts/install-git-hooks.sh"
      become: yes
      become_user: "{{ target_user }}"
      register: pops_hooks_install
      changed_when: "'linked' in pops_hooks_install.stdout"
      failed_when: pops_hooks_install.rc not in [0, 1]
      tags: [githooks]

    - name: Report git hook installation
      ansible.builtin.debug:
        var: pops_hooks_install.stdout_lines
      tags: [githooks]

    - name: Ensure pops origin remote uses the Athena hub
      community.general.git_config:
        name: remote.origin.url
        value: "will@athena.home.arpa:/home/will/git/pops.git"
        scope: local
        repo: "{{ target_home }}/pops"
      become: yes
      become_user: "{{ target_user }}"

    - name: Ensure ansible-netbox origin remote uses the Athena hub
      community.general.git_config:
        name: remote.origin.url
        value: "will@athena.home.arpa:/home/will/git/ansible-netbox.git"
        scope: local
        repo: "{{ target_home }}/ansible-netbox"
      become: yes
      become_user: "{{ target_user }}"

    # Trac #4031: setting remote.origin.url above is not enough. The trunk's
    # tracking ref is what agent-sync-check.sh actually follows, and on every
    # host it still pointed at github/main, so the fleet pulled through the
    # GitHub mirror instead of the Athena hub (and ynh2, whose github remote is
    # an unauthenticated HTTPS URL, never synced at all). Pin it explicitly.
    # NOT guarded for ynh2: this writes git config in the user's home and does
    # not touch YunoHost's package namespace.
    - name: Pin pops trunk to track the Athena hub
      ansible.builtin.command:
        cmd: git branch --set-upstream-to=origin/main main
        chdir: "{{ target_home }}/pops"
      become: yes
      become_user: "{{ target_user }}"
      register: pops_upstream
      changed_when: "'set up to track' in pops_upstream.stdout"
      failed_when:
        - pops_upstream.rc != 0
        - "'set up to track' not in pops_upstream.stdout"

    - name: Pin ansible-netbox trunk to track the Athena hub
      ansible.builtin.command:
        cmd: git branch --set-upstream-to=origin/master master
        chdir: "{{ target_home }}/ansible-netbox"
      become: yes
      become_user: "{{ target_user }}"
      register: anb_upstream
      changed_when: "'set up to track' in anb_upstream.stdout"
      failed_when:
        - anb_upstream.rc != 0
        - "'set up to track' not in anb_upstream.stdout"

    # Existing checkouts cannot receive the current sync script through the
    # bootstrap-only rsync tasks above: rsyncing .git would overwrite local
    # refs and stashes. Stage the script outside the repository instead. The
    # script itself is non-destructive for dirty, unmerged, remote-backed, or
    # otherwise ambiguous branches. A recovered clean checkout then pulls the
    # merged script from the hub during the same run.
    - name: Create isolated agent sync staging directory
      ansible.builtin.file:
        path: "/tmp/ansible-agent-sync-{{ inventory_hostname }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0700'
      when: pops_git_stat.stat.exists

    - name: Stage current agent sync script for existing checkout refresh
      ansible.builtin.copy:
        src: "/home/will/pops/scripts/agent-sync-check.sh"
        dest: "/tmp/ansible-agent-sync-{{ inventory_hostname }}/agent-sync-check.sh"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'
      when: pops_git_stat.stat.exists

    - name: Run staged agent sync script against existing repositories
      ansible.builtin.command:
        cmd: "bash /tmp/ansible-agent-sync-{{ inventory_hostname }}/agent-sync-check.sh"
      become: yes
      become_user: "{{ target_user }}"
      environment:
        TMPDIR: "/tmp/ansible-agent-sync-{{ inventory_hostname }}"
      register: staged_agent_sync
      changed_when: false
      failed_when: false
      when: pops_git_stat.stat.exists

    - name: Report staged agent sync result
      ansible.builtin.debug:
        msg: "{{ staged_agent_sync.stdout_lines | default([]) }}"
      when:
        - pops_git_stat.stat.exists
        - staged_agent_sync is defined

    - name: Fast-forward clean pops trunk from hub
      ansible.builtin.shell: |
        test "$(git branch --show-current)" = main
        test -z "$(git status --porcelain)"
        git pull --ff-only origin main
      args:
        chdir: "{{ target_home }}/pops"
      become: yes
      become_user: "{{ target_user }}"
      register: pops_sync
      changed_when: "'Fast-forward' in pops_sync.stdout"
      failed_when: false

    - name: Fast-forward clean ansible-netbox trunk from hub
      ansible.builtin.shell: |
        test "$(git branch --show-current)" = master
        test -z "$(git status --porcelain)"
        git pull --ff-only origin master
      args:
        chdir: "{{ target_home }}/ansible-netbox"
      become: yes
      become_user: "{{ target_user }}"
      register: anb_sync
      changed_when: "'Fast-forward' in anb_sync.stdout"
      failed_when: false

    # ynh2 carries an HTTPS github URL it cannot authenticate to. Agent nodes
    # have no reason to reach GitHub at all -- only athena mirrors outward
    # (#3968, #4030) -- so normalise every node to the SSH form for consistency
    # with the other four hosts.
    - name: Normalise github remote URL on pops (SSH form)
      community.general.git_config:
        name: remote.github.url
        value: "git@github.com:wrtaff/pops-infra.git"
        scope: local
        repo: "{{ target_home }}/pops"
      become: yes
      become_user: "{{ target_user }}"

    - name: Check if pops/wiki git repository exists on target
      ansible.builtin.stat:
        path: "{{ target_home }}/pops/wiki/.git"
      register: wiki_git_stat

    - name: Ensure wiki repo athena remote uses an SSH URL, not a bare local path
      community.general.git_config:
        name: remote.athena.url
        value: "will@athena.home.arpa:/home/will/git/pops-kms.git"
        scope: local
        repo: "{{ target_home }}/pops/wiki"
      become: yes
      become_user: "{{ target_user }}"
      when: wiki_git_stat.stat.exists

    # Trac #4033 Phase 3: raw/ now has its own hub (pops-raw.git), mirroring
    # wiki/'s pops-kms.git pattern exactly -- same remote name (athena), same
    # correction-not-clone behavior. As with wiki/, the initial clone onto
    # each fleet host was performed manually, not by this playbook; this task
    # only corrects the remote URL where a clone already exists.
    - name: Check if pops/raw git repository exists on target
      ansible.builtin.stat:
        path: "{{ target_home }}/pops/raw/.git"
      register: raw_git_stat

    - name: Ensure raw repo athena remote uses an SSH URL, not a bare local path
      community.general.git_config:
        name: remote.athena.url
        value: "will@athena.home.arpa:/home/will/git/pops-raw.git"
        scope: local
        repo: "{{ target_home }}/pops/raw"
      become: yes
      become_user: "{{ target_user }}"
      when: raw_git_stat.stat.exists

    - name: Ensure athena's SSH host key is trusted for non-interactive git operations
      ansible.builtin.known_hosts:
        name: athena.home.arpa
        key: "athena.home.arpa ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINIt2g/nHU94Ks0XTwRXTi/0VRGsxrYeYmyK5Y9MeNQe"
        path: "{{ target_home }}/.ssh/known_hosts"
        state: present
      become: yes
      become_user: "{{ target_user }}"
      when: wiki_git_stat.stat.exists or raw_git_stat.stat.exists

    - name: Ensure .config directory exists
      ansible.builtin.file:
        path: "{{ target_home }}/.config"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'

    - name: Template mcp-secrets.env with vault secrets
      ansible.builtin.template:
        src: mcp-secrets.env.j2
        dest: "{{ target_home }}/.config/mcp-secrets.env"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0600'

    - name: Ensure MCP secrets are sourced in .bashrc
      ansible.builtin.blockinfile:
        path: "{{ target_home }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: MCP Secrets"
        insertbefore: BOF
        block: |
          # Source MCP secrets so non-interactive shells get them
          if [ -f "$HOME/.config/mcp-secrets.env" ]; then
              set -a
              source "$HOME/.config/mcp-secrets.env"
              set +a
          fi
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Ensure Agent Runner path, aliases, and sync check are in .bashrc
      ansible.builtin.blockinfile:
        path: "{{ target_home }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: Agent Runner Settings"
        insertafter: EOF
        block: |
          # Paths
          export PATH="$HOME/.local/bin:$HOME/go/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

          # Aliases
          alias oc='opencode'
          alias cdp='cd $HOME/pops'
          alias cdpc='clear; cd $HOME/pops; claude'
          alias cdpo='clear; cd $HOME/pops; opencode'
          alias cdpg='clear; cd $HOME/pops; agy'

          # Fleet readiness preflight (Trac #4026). Read-only; 'rtwf' merges
          # outstanding agent/* branches first. Harness-agnostic entry point:
          # usable from any shell, or invoked by any agent regardless of CLI.
          alias rtw='$HOME/pops/scripts/ready-to-work.sh'
          alias rtwf='$HOME/pops/scripts/ready-to-work.sh --merge'

          # Run agent sync check on session start (for Antigravity, OpenCode, and human sessions)
          if [ -z "$AGENT_SYNC_CHECK_DONE" ] && [ -x "$HOME/pops/scripts/agent-sync-check.sh" ]; then
              export AGENT_SYNC_CHECK_DONE=1
              "$HOME/pops/scripts/agent-sync-check.sh"
          fi
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Create apt-daily systemd drop-in directories
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - apt-daily.service
        - apt-daily-upgrade.service

    - name: Deploy apt-daily systemd drop-ins to bypass failing wait-online helper
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item }}.d/override.conf"
        content: |
          [Service]
          ExecStartPre=
        owner: root
        group: root
        mode: '0644'
      loop:
        - apt-daily.service
        - apt-daily-upgrade.service

    - name: Reload systemd units after drop-in changes
      ansible.builtin.systemd_service:
        daemon_reload: yes

    - name: Register agent runner in NetBox
      netbox.netbox.netbox_virtual_machine:
        netbox_url: "{{ netbox_url | default('http://netbox1.home.arpa:80') }}"
        netbox_token: "{{ netbox_api_token }}"
        data:
          name: "{{ inventory_hostname }}"
          cluster: "{{ netbox_cluster | default('home-cluster') }}"
          status: "active"
      delegate_to: localhost
      run_once: false
      ignore_errors: yes
      vars:
        ansible_python_interpreter: "{{ lookup('env', 'VIRTUAL_ENV') | default('/home/will/ansible-netbox/.venv', true) }}/bin/python3"

- import_playbook: install_antigravity.yml
- import_playbook: install_opencode.yml
- import_playbook: install_claude_code.yml
- import_playbook: configure_mcp_servers_remote.yml
- import_playbook: install_tmux.yml
- import_playbook: install_yt_dlp.yml
- import_playbook: install_gnucash_mcp.yml
- import_playbook: install_pypdf.yml

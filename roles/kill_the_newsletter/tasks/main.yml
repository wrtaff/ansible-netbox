---
- name: Inspect installed Node.js runtime
  ansible.builtin.command: node --version
  register: ktn_node_version
  failed_when: false
  changed_when: false

- name: Install managed Node.js runtime when Node 22 is unavailable
  ansible.builtin.include_role:
    name: nodejs
  when: ktn_node_version.rc != 0 or not (ktn_node_version.stdout is match('^v22\.'))

- name: Install KTN build dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - git
      - pkg-config
    state: present
    update_cache: true

- name: Create KTN service group
  ansible.builtin.group:
    name: "{{ ktn_group }}"
    system: true

- name: Create KTN service account
  ansible.builtin.user:
    name: "{{ ktn_user }}"
    group: "{{ ktn_group }}"
    system: true
    home: "/var/lib/{{ ktn_user }}"
    create_home: false

- name: Create KTN state and TLS directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ktn_data_directory }}", owner: "{{ ktn_user }}", group: "{{ ktn_group }}", mode: "0750" }
    - { path: "{{ ktn_tls_directory }}", owner: "root", group: "{{ ktn_group }}", mode: "0750" }

- name: Fetch pinned KTN source
  ansible.builtin.git:
    repo: "{{ ktn_repository }}"
    dest: "{{ ktn_root }}"
    version: "{{ ktn_version }}"
    force: true
  register: ktn_source

- name: Allow unprivileged KTN SMTP port configuration
  ansible.builtin.replace:
    path: "{{ ktn_root }}/source/index.mts"
    regexp: "application\\.email\\.listen\\(25\\);"
    replace: "application.email.listen(Number(process.env.SMTP_PORT ?? {{ ktn_smtp_port }}));"
  register: ktn_smtp_patch

- name: Force the embedded Caddy proxy to local HTTP
  ansible.builtin.replace:
    path: "{{ ktn_root }}/source/index.mts"
    regexp: "caddy\\.start\\(\\{\\n    \\.\\.\\.application\\.configuration,"
    replace: "caddy.start({\n    ...application.configuration,\n    hostname: `http://${application.configuration.hostname}`,"
  register: ktn_caddy_patch

- name: Raise feed visualization rate limit for self-hosted instances
  ansible.builtin.replace:
    path: "{{ ktn_root }}/source/index.mts"
    regexp: 'count" > 10\b'
    replace: 'count" > 999999999'
  register: ktn_ratelimit_patch

- name: Emit LAN HTTP endpoint in Atom feed XML links
  ansible.builtin.replace:
    path: "{{ ktn_root }}/source/index.mts"
    regexp: 'href="https://\$\{\s*application\.configuration\s*\.hostname\s*\}'
    replace: 'href="http://${application.configuration.hostname}:{{ ktn_http_port }}'
  register: ktn_feed_url_patch

- name: Emit LAN HTTP endpoint in KTN feed copy-to-clipboard UI
  ansible.builtin.replace:
    path: "{{ ktn_root }}/source/index.mts"
    regexp: 'https://\$\{\s*application\.configuration\s*\.hostname\s*\}(/feeds/\$\{request\.state\.feed\.publicId\}\.xml)'
    replace: 'http://${application.configuration.hostname}:{{ ktn_http_port }}\1'
  register: ktn_feed_ui_copy_patch

- name: Add Atom feed autodiscovery link and XML content negotiation to feed settings page
  ansible.builtin.replace:
    path: "{{ ktn_root }}/source/index.mts"
    regexp: 'if \(request\.state\.feed === undefined\) return;\s*response\.send\(\s*application\.layout\(\{\s*request,\s*response,\s*head: html`\s*<title>\$\{request\.state\.feed\.title\} · Kill the Newsletter!</title>'
    replace: "if (request.state.feed === undefined) return;\n    if (request.headers.accept?.includes('xml') || request.headers.accept?.includes('atom') || request.headers.accept?.includes('rss')) { response.redirect!(`/feeds/${request.state.feed.publicId}.xml`); return; }\n    response.send(\n      application.layout({\n        request,\n        response,\n        head: html`\n          <title>${request.state.feed.title} · Kill the Newsletter!</title>\n          <link rel=\"alternate\" type=\"application/atom+xml\" href=\"http://${application.configuration.hostname}:{{ ktn_http_port }}/feeds/${request.state.feed.publicId}.xml\" title=\"${request.state.feed.title}\" />"
  register: ktn_autodiscovery_patch

- name: Wrap KTN entry HTML in semantic article container with title for read-it-later extractors
  ansible.builtin.replace:
    path: "{{ ktn_root }}/source/index.mts"
    regexp: 'const feedEntry = application\.database\.get<\{\s*content: string;\s*\}\>\(\s*sql`\s*select "feedEntries"\."content" as "content"\s*from "feedEntries"\s*where\s*"feedEntries"\."feed" = \$\{request\.state\.feed\.id\} and\s*"feedEntries"\."publicId" = \$\{request\.pathname\.feedEntryPublicId\};\s*`,\s*\);\s*if \(feedEntry === undefined\) return;\s*response\s*\.setHeader\(\s*"Content-Security-Policy",\s*"default-src ''self''; img-src \*; style-src ''self'' ''unsafe-inline''; frame-src ''none''; object-src ''none''; form-action ''self''; frame-ancestors ''none''",\s*\)\s*\.setHeader\("Cross-Origin-Embedder-Policy", "unsafe-none"\)\s*\.send\(feedEntry\.content\);'
    replace: "const feedEntry = application.database.get<{\n      title: string;\n      content: string;\n    }>(\n      sql`\n        select \"feedEntries\".\"title\" as \"title\", \"feedEntries\".\"content\" as \"content\"\n        from \"feedEntries\"\n        where\n          \"feedEntries\".\"feed\" = ${request.state.feed.id} and\n          \"feedEntries\".\"publicId\" = ${request.pathname.feedEntryPublicId};\n      `,\n    );\n    if (feedEntry === undefined) return;\n    const escapedTitle = feedEntry.title.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('\"', '&quot;');\n    response\n      .setHeader(\n        \"Content-Security-Policy\",\n        \"default-src 'self'; img-src *; style-src 'self' 'unsafe-inline'; frame-src 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'none'\",\n      )\n      .setHeader(\"Cross-Origin-Embedder-Policy\", \"unsafe-none\")\n      .send(`<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"/><title>${escapedTitle}</title><style>body{max-width:800px;margin:20px auto;padding:0 20px;font-family:system-ui,sans-serif;line-height:1.6}article{width:100%}img{max-width:100%;height:auto}</style></head><body><article class=\"entry-content\"><h1>${escapedTitle}</h1>${feedEntry.content}</article></body></html>`);"
  register: ktn_entry_article_patch

- name: Check whether KTN dependencies are installed
  ansible.builtin.stat:
    path: "{{ ktn_root }}/node_modules"
  register: ktn_node_modules

- name: Install KTN Node dependencies
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ ktn_root }}"
  when: ktn_source.changed or ktn_smtp_patch.changed or ktn_caddy_patch.changed or ktn_ratelimit_patch.changed or ktn_feed_url_patch.changed or ktn_feed_ui_copy_patch.changed or ktn_autodiscovery_patch.changed or not ktn_node_modules.stat.exists
  changed_when: true

- name: Patch @radically-straightforward/server CSRF protection to allow HTTP HEAD requests
  ansible.builtin.replace:
    path: "{{ ktn_root }}/node_modules/@radically-straightforward/server/build/index.mjs"
    regexp: 'if \(request\.method !== "GET" &&'
    replace: 'if (request.method !== "GET" && request.method !== "HEAD" &&'
  register: ktn_server_head_csrf_patch
  notify: Restart KTN

- name: Patch @radically-straightforward/server route matching to support HTTP HEAD requests
  ansible.builtin.replace:
    path: "{{ ktn_root }}/node_modules/@radically-straightforward/server/build/index.mjs"
    regexp: '\(typeof route\.method === "string" &&\s*request\.method !== route\.method\) \|\|'
    replace: '(typeof route.method === "string" && request.method !== route.method && !(route.method === "GET" && request.method === "HEAD")) ||'
  register: ktn_server_head_route_patch
  notify: Restart KTN

- name: Patch @radically-straightforward/server response.send to omit body on HTTP HEAD requests
  ansible.builtin.replace:
    path: "{{ ktn_root }}/node_modules/@radically-straightforward/server/build/index.mjs"
    regexp: 'response\.send = \(responseBody\) => \{\s*response\.end\(responseBody\);'
    replace: 'response.send = (responseBody) => {\n                    if (request.method === "HEAD") { response.end(); } else { response.end(responseBody); }'
  register: ktn_server_head_send_patch
  notify: Restart KTN

- name: Build KTN application
  ansible.builtin.command: npm run prepare
  args:
    chdir: "{{ ktn_root }}"
  when: ktn_source.changed or ktn_smtp_patch.changed or ktn_caddy_patch.changed or ktn_ratelimit_patch.changed or ktn_feed_url_patch.changed or ktn_feed_ui_copy_patch.changed or ktn_autodiscovery_patch.changed or ktn_entry_article_patch.changed
  changed_when: true
  notify: Restart KTN

- name: Write KTN runtime configuration
  ansible.builtin.template:
    src: configuration.mjs.j2
    dest: "/etc/kill-the-newsletter.mjs"
    owner: root
    group: "{{ ktn_group }}"
    mode: "0640"
  notify: Restart KTN

- name: Ensure local KTN feed provisioning directory exists
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install local KTN feed provisioning helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/create_ktn_feed.py"
    dest: /usr/local/libexec/ktn-create-feed.py
    owner: root
    group: root
    mode: "0755"

- name: Install local KTN feed provisioning wrapper
  ansible.builtin.template:
    src: ktn-feed-provisioner.sh.j2
    dest: "{{ ktn_feed_provisioner_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Write Tailnet certificate refresh script
  ansible.builtin.template:
    src: refresh-tailscale-cert.sh.j2
    dest: "/usr/local/sbin/refresh-ktn-tailscale-cert"
    owner: root
    group: root
    mode: "0750"

- name: Install KTN certificate refresh units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ktn-tailscale-cert.service
    - ktn-tailscale-cert.timer
  when: ktn_enable_tailscale | bool
  notify: Reload systemd

- name: Enable KTN certificate refresh timer
  ansible.builtin.systemd:
    name: ktn-tailscale-cert.timer
    enabled: true
    state: started
    daemon_reload: true
  when: ktn_enable_tailscale | bool

- name: Issue KTN Tailnet certificate for SMTP TLS
  ansible.builtin.command: /usr/local/sbin/refresh-ktn-tailscale-cert
  changed_when: false
  when: ktn_enable_tailscale | bool

- name: Install KTN service unit
  ansible.builtin.template:
    src: kill-the-newsletter.service.j2
    dest: "/etc/systemd/system/kill-the-newsletter.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart KTN

- name: Enable and start KTN service
  ansible.builtin.systemd:
    name: kill-the-newsletter.service
    enabled: true
    state: started
    daemon_reload: true

- name: Require the KTN IMAP credential from Ansible Vault
  ansible.builtin.assert:
    that:
      - ktn_imap_password is defined
      - ktn_imap_password | length > 0
    fail_msg: "Define ktn_imap_password in the encrypted Ansible vault before deploying the KTN IMAP puller."
  no_log: true

- name: Create KTN puller state directory
  ansible.builtin.file:
    path: "{{ ktn_puller_state_directory }}"
    state: directory
    owner: "{{ ktn_user }}"
    group: "{{ ktn_group }}"
    mode: "0750"

- name: Install KTN direct-ID IMAP puller
  ansible.builtin.template:
    src: ktn-imap-puller.py.j2
    dest: /usr/local/sbin/ktn-imap-puller
    owner: root
    group: root
    mode: "0755"

- name: Write KTN IMAP puller credentials
  ansible.builtin.template:
    src: ktn-imap-puller.env.j2
    dest: /etc/ktn-imap-puller.env
    owner: root
    group: "{{ ktn_group }}"
    mode: "0640"
  no_log: true

- name: Install KTN IMAP puller systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ktn-imap-puller.service
    - ktn-imap-puller.timer
  notify: Reload systemd

- name: Enable KTN IMAP puller timer
  ansible.builtin.systemd:
    name: ktn-imap-puller.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Apply KTN configuration before enabling the public proxy
  ansible.builtin.meta: flush_handlers

- name: Configure Tailnet HTTPS proxy to KTN
  ansible.builtin.command: >
    tailscale serve --bg --https=443 http://127.0.0.1:{{ ktn_http_port }}
  changed_when: false
  when: ktn_enable_tailscale | bool

- name: Wait for KTN SMTP listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ktn_smtp_port }}"
    timeout: 60
